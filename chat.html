<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>双人视频同步聊天 · 实时协作画板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1a1e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            max-width: 1400px;
            width: 100%;
            background: #0f1219;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6);
        }

        /* 视频区域 */
        .video-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .video-wrapper {
            flex: 1 1 300px;
            background: #202532;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16 / 9;
            border: 2px solid #2a3142;
            transition: border-color 0.2s;
        }

        .video-wrapper.local {
            border-color: #4b7bec;
        }

        .video-wrapper.remote {
            border-color: #20bf6b;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #111;
        }

        .video-label {
            position: absolute;
            bottom: 12px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .video-wrapper.local .video-label {
            background: rgba(75, 123, 236, 0.7);
        }

        .video-wrapper.remote .video-label {
            background: rgba(32, 191, 107, 0.7);
        }

        /* 画板区域 */
        .canvas-section {
            background: #202532;
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #2a3142;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .canvas-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #eef2ff;
            font-weight: 500;
            font-size: 16px;
        }

        .canvas-title svg {
            width: 22px;
            height: 22px;
            fill: #8c7ae6;
        }

        .canvas-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: #2d3448;
            border: none;
            color: #d0d9f0;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #3c445c;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: #3a425b;
            color: white;
            border-color: #5b6b8c;
        }

        .btn.primary {
            background: #4b7bec;
            border-color: #6a8cff;
            color: white;
        }

        .btn.primary:hover {
            background: #5f8aff;
        }

        .btn.danger {
            background: #eb4d4b;
            border-color: #ff6b6b;
            color: white;
        }

        .btn.danger:hover {
            background: #ff5e5c;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c212e;
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid #363f55;
        }

        .color-picker-wrapper label {
            color: #b6c2e0;
            font-size: 13px;
            font-weight: 500;
        }
