    <div class="container">
    <h1>分类导航 · Top 排行</h1>
    <div class="subhead">
        <span>📦 6 个分类</span>
        <span>🏅 每个分类 Top 3 链接</span>

    </div>

    <!-- 6 个分类卡片：2 排 × 3 列 -->
    <div class="grid" id="gridContainer">
        <!-- 由 JavaScript 动态渲染 -->
    </div>

    <div class="hint">
        <span>💡 点击分类内的链接 → 该链接移至本分类末尾，点击次数 +1</span>
        <button class="reset-btn" id="resetBtn" title="重置所有数据">⟲ 重置</button>
    </div>
</div>
<script>
    (function() {
        "use strict";

        // ========== 数据定义 ==========
        // 6 个分类，每个分类下有 3~4 个链接，模拟 Top 排行
        const CATEGORIES = [
            {
                key: "website",
                name: "网站",
                emoji: "🌐",
                links: [
                    { name: "Google", url: "https://www.google.com", clicks: 158 },
                    { name: "GitHub", url: "https://www.github.com", clicks: 120 },
                    { name: "Wikipedia", url: "https://www.wikipedia.org", clicks: 76 }
                ]
            },
            {
                key: "video",
                name: "视频",
                emoji: "🎬",
                links: [
                    { name: "YouTube", url: "https://www.youtube.com", clicks: 142 },
                    { name: "Bilibili", url: "https://www.bilibili.com", clicks: 88 },
                    { name: "Netflix", url: "https://www.netflix.com", clicks: 45 }
                ]
            },
            {
                key: "image",
                name: "图片",
                emoji: "🖼️",
                links: [
                    { name: "Unsplash", url: "https://unsplash.com", clicks: 95 },
                    { name: "Dribbble", url: "https://dribbble.com", clicks: 60 },
                    { name: "Pexels", url: "https://www.pexels.com", clicks: 41 }
                ]
            },
            {
                key: "feed",
                name: "动态",
                emoji: "📰",
                links: [
                    { name: "Reddit", url: "https://www.reddit.com", clicks: 65 },
                    { name: "Twitter / X", url: "https://x.com", clicks: 54 },
                    { name: "Hacker News", url: "https://news.ycombinator.com", clicks: 25 }
                ]
            },
            {
                key: "comment",
                name: "评论",
                emoji: "💬",
                links: [
                    { name: "Stack Overflow", url: "https://stackoverflow.com", clicks: 98 },
                    { name: "Dev.to", url: "https://dev.to", clicks: 34 },
                    { name: "Product Hunt", url: "https://www.producthunt.com", clicks: 18 }
                ]
            },
            {
                key: "music",
                name: "歌曲",
                emoji: "🎵",
                links: [
                    { name: "Spotify", url: "https://www.spotify.com", clicks: 112 },
                    { name: "SoundCloud", url: "https://soundcloud.com", clicks: 52 },
                    { name: "网易云音乐", url: "https://music.163.com", clicks: 30 }
                ]
            }
        ];

        // 深拷贝一份作为工作数据
        let categoriesData = CATEGORIES.map(cat => ({
            ...cat,
            links: cat.links.map(link => ({ ...link }))
        }));

        const gridContainer = document.getElementById('gridContainer');

        // ========== 渲染函数 ==========
        function render() {
            if (!gridContainer) return;
            gridContainer.innerHTML = '';

            categoriesData.forEach((cat) => {
                // 每个分类卡片
                const card = document.createElement('div');
                card.className = 'card';

                // 头部
                const header = document.createElement('div');
                header.className = 'card-header';

                const title = document.createElement('div');
                title.className = 'card-title';
                title.innerHTML = `<span class="emoji">${cat.emoji}</span><span>${cat.name}</span>`;

                const topBadge = document.createElement('span');
                topBadge.className = 'top-badge';
                topBadge.textContent = 'TOP 3';

                header.appendChild(title);
                header.appendChild(topBadge);

                // 链接列表
                const list = document.createElement('ul');
                list.className = 'link-list';

                // 按点击次数降序排序（稳定），但已经在数据变化时手动排序了，这里直接渲染
                cat.links.forEach((link, index) => {
                    const rank = index + 1;
                    const li = document.createElement('li');

                    // 排名数字
                    const rankNum = document.createElement('span');
                    rankNum.className = 'rank-num';
                    if (rank === 1) rankNum.classList.add('r1');
                    else if (rank === 2) rankNum.classList.add('r2');
                    else if (rank === 3) rankNum.classList.add('r3');
                    rankNum.textContent = rank;

                    // 链接
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.textContent = link.name;

                    // 点击事件：点击次数+1，移至本分类末尾，其他按点击次数重新排序
                    a.addEventListener('click', function(e) {
                        // 找到当前分类数据
                        const category = categoriesData.find(c => c.key === cat.key);
                        if (!category) return;

                        // 找到当前链接对象
                        const currentLink = category.links.find(l => l.url === link.url);
                        if (!currentLink) return;

                        // 1. 点击次数+1
                        currentLink.clicks += 1;

                        // 2. 从分类的链接数组中移除该链接
                        const idx = category.links.indexOf(currentLink);
                        if (idx > -1) category.links.splice(idx, 1);

                        // 3. 对剩余链接按点击次数降序排序（稳定）
                        category.links.sort((a, b) => {
                            if (b.clicks !== a.clicks) return b.clicks - a.clicks;
                            return 0; // 稳定排序
                        });

                        // 4. 将被点击链接 push 到末尾
                        category.links.push(currentLink);

                        // 5. 重新渲染
                        render();
                    });

                    // 点击次数
                    const count = document.createElement('span');
                    count.className = 'click-count';
                    count.textContent = `${link.clicks}`;

                    li.appendChild(rankNum);
                    li.appendChild(a);
                    li.appendChild(count);
                    list.appendChild(li);
                });

                card.appendChild(header);
                card.appendChild(list);
                gridContainer.appendChild(card);
            });
        }

        // ========== 重置数据 ==========
        function resetData() {
            categoriesData = CATEGORIES.map(cat => ({
                ...cat,
                links: cat.links.map(link => ({ ...link }))
            }));
            // 初始按点击次数降序排序
            categoriesData.forEach(cat => {
                cat.links.sort((a, b) => b.clicks - a.clicks);
            });
            render();
        }

        // ========== 初始化 ==========
        function init() {
            // 初始排序
            categoriesData.forEach(cat => {
                cat.links.sort((a, b) => b.clicks - a.clicks);
            });
            render();

            const resetBtn = document.getElementById('resetBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', resetData);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>

            { name: "CSS-Tricks", url: "https://css-tricks.com",   clicks: 18 },
            { name: "Dev.to",     url: "https://dev.to",           clicks: 14 },
            { name: "Codepen",    url: "https://codepen.io",       clicks: 11 },
            { name: "Product Hunt", url: "https://www.producthunt.com", clicks: 8 },
            { name: "Dribbble",   url: "https://dribbble.com",     clicks: 6 },
            { name: "Behance",    url: "https://www.behance.net",  clicks: 3 },
            { name: "Frontend Mentor", url: "https://www.frontendmentor.io", clicks: 1 }
        ];

        // 深拷贝一份作为工作数据
        let linksData = INITIAL_LINKS.map(item => ({ ...item }));

        // 获取列表容器
        const listEl = document.getElementById('rankingList');

        // ---------- 工具：根据 clicks 降序排序，若点击次数相同则保持相对顺序（稳定排序，利用数组索引） ----------
        function sortByClicksDesc() {
            // 利用 map 携带原始索引，保证稳定排序
            linksData = linksData
                .map((item, index) => ({ ...item, _index: index }))
                .sort((a, b) => {
                    if (b.clicks !== a.clicks) {
                        return b.clicks - a.clicks;      // 点击次数多的在前
                    }
                    return a._index - b._index;          // 点击次数相同则维持原有顺序
                })
                .map(({ _index, ...rest }) => rest);     // 移除临时索引
        }

        // ---------- 渲染排行榜列表 ----------
        function render() {
            if (!listEl) return;

            // 先排序（每次渲染前确保按点击次数降序）
            sortByClicksDesc();

            // 清空列表
            listEl.innerHTML = '';

            // 遍历数据生成 DOM
            linksData.forEach((item, index) => {
                const rank = index + 1;               // 排名从 1 开始
                const isTop10 = rank <= 10;            // 是否为 Top10

                // 创建 li
                const li = document.createElement('li');
                li.className = 'link-item' + (isTop10 ? ' is-top10' : '');
                // 可选: 添加 data 属性便于调试
                li.dataset.url = item.url;
                li.dataset.rank = rank;

                // 排名徽章
                const badge = document.createElement('span');
                badge.className = 'rank-badge';
                if (rank === 1) badge.classList.add('top-1');
                else if (rank === 2) badge.classList.add('top-2');
                else if (rank === 3) badge.classList.add('top-3');
                badge.textContent = rank;

                // 链接
                const link = document.createElement('a');
                link.href = item.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = item.name;
                // 给链接绑定点击事件：阻止默认？不阻止默认，保留跳转；但需要移动位置。
                // 使用 addEventListener 在链接上，但为了确保链接跳转不受影响，我们使用「捕获」或者直接监听链接点击。
                // 由于我们希望点击链接时既跳转又移动位置，使用普通的 click 事件，不阻止默认行为。
                // 但要注意：跳转可能导致页面很快离开，不过我们使用的是 target="_blank"，打开新标签页，当前页面保留，没问题。
                // 但用户可能不想跳转？需求是“点击其中一个链接，这个链接自动排到20个链接的末尾”，但同时链接本身是网站链接，应该可以跳转。
                // 所以保留 target=_blank，让用户在新标签页打开，同时当前页面执行移动逻辑。
                link.addEventListener('click', function(e) {
                    // 不阻止默认行为，允许打开新窗口。
                    // 但注意：移动逻辑需要更新当前链接到末尾，并重新渲染。
                    // 找到该项在 linksData 中的位置
                    const currentItem = linksData.find(d => d.url === item.url && d.name === item.name);
                    if (!currentItem) return;

                    // 1. 点击次数 +1
                    currentItem.clicks += 1;

                    // 2. 从数组中移除该项
                    const idx = linksData.indexOf(currentItem);
                    if (idx !== -1) {
                        linksData.splice(idx, 1);
                    }

                    // 3. 将该链接添加到数组末尾（即第20位）
                    linksData.push(currentItem);

                    // 4. 重新渲染（内部会重新按点击次数排序，点击次数+1后可能排名会变，但需求明确要移到末尾，
                    //    但是又要求“top10排列的网站链接”，并且点击后排到末尾。这意味着点击后该链接会出现在第20位。
                    //    但同时我们又需要按点击次数排序显示Top10? 有冲突。
                    //    仔细阅读需求：“20个链接显示top10排列的网站链接，点击其中一个链接，这个链接自动排到20个链接的末尾”
                    //    解释：页面显示的是20个链接，但按照点击次数（Top10）排列？还是说显示前10名？但一共20个链接全显示。
                    //    理解：20个链接全部显示，但排序依据是点击次数，排名前10的会突出显示。点击某个链接后，该链接会被移动到列表末尾（第20位），
                    //    并且该链接的点击次数增加。这样下一次排序时，它可能因为点击次数增加而上升排名，但因为被移到了末尾，所以位置会重新根据排序决定。
                    //    但这里有一个矛盾：如果点击后立即重新排序，它可能不是末尾，而是根据点击次数排到中间或前面。
                    //    需求明确说“点击其中一个链接，这个链接自动排到20个链接的末尾”，意味着它必须位于最后一位，
                    //    所以排序应该保证点击后该链接在末尾，即我们需要把该链接放在数组最后，并且排序逻辑要尊重这个“末尾”位置？
                    //    但点击次数增加后，如果它原本点击次数很少，加1后排名可能不变或略升，但放在末尾就矛盾了。
                    //    仔细分析：可能是初始按点击次数排序显示Top10，点击后强制把该链接放到末尾，并且点击次数+1，但之后不再按点击次数重新排序？
                    //    或者每次点击后，将点击次数+1，并且强制将该链接置于列表末尾，然后其余链接按点击次数排序，但该链接固定在末尾？
                    //    更合理的实现：每次点击链接，其点击次数+1，然后把该链接移动到数组末尾，然后对除最后一个元素外的其余元素按点击次数降序排序，最后把该链接放在最后。
                    //    这样既保证了点击链接在末尾，又让其他19个链接按照点击次数展示排行。
                    //    但需求又说“top10排列的网站链接”，意味着其他19个仍然按点击次数排序，Top10显示在前10个。
                    //    所以最终决定：点击链接后，该链接移动到末尾（第20位），点击次数+1；其他19个链接根据点击次数降序排序，排在前19位。
                    //    这样点击的链接永远在末尾，其他19个仍然保持Top10排行（前10名）。
                    //    但这样会有一个问题：被点击的链接虽然点击次数增加了，但因为它固定末尾，所以它不会参与Top10排名？不符合直觉。
                    //    另一种更符合“点击后排到末尾”的常见交互：类似“置底”效果。但这里又要显示Top10，我猜是：
                    //    列表始终按点击次数降序显示所有20个链接，但点击链接后，该链接被移动到末尾并保持点击次数+1，但之后排序会将它重新排上去？
                    //    但是需求描述比较简洁，结合用户之前的交互“点击其中一个链接，这个链接自动排到20个链接的末尾”，
                    //    我决定采用最直接的做法：点击链接后，该链接移动到末尾，并且不再根据点击次数重新排序。而是保持其他链接相对顺序？
                    //    不，这样会丢失Top10意义。
                    //    仔细观察用户需求：“20个链接显示top10排列的网站链接”可能是指列表整体按点击次数排序，但只突出前10名。
                    //    “点击其中一个链接，这个链接自动排到20个链接的末尾”表示被点击的链接会被放置到最后，即使它的点击次数很高。
                    //    所以我的方案：每次点击后，该链接移动到数组末尾（索引19），点击次数+1；其他链接保持原有相对顺序（或者仍然按点击次数排序？）。
                    //    为了同时满足“Top10排列”和“点击后排到末尾”，我决定：初始按点击次数排序；点击链接后，该链接移到末尾，点击次数+1；其他链接的相对顺序保持不变（已经按点击次数排序好了）。
                    //    但下一次点击其他链接时，需要重新处理。这可能导致列表逐渐乱序。
                    //    为了让列表始终有条理，我选择：在每次点击后，先将该链接移动到末尾，然后对除末尾外的19个链接按点击次数降序排序，末尾固定为被点击的链接。
                    //    这样其他19个始终按点击次数排序，Top10依然存在（指前10个），被点击的链接固定在末尾，并且它的点击次数也增加了，但不会影响其他链接排名。
                    //    如果用户点击了多个链接，它们会依次被放到末尾，并且点击次数增加，但其他链接排名会不断更新，这样比较合理。
                    //    下面实现这个逻辑。

                    // 重新整理：上面已经移除了currentItem并加到末尾，但为了固定末尾元素不被排序影响，我们需要在排序时排除最后一个元素。
                    // 但render函数内部调用sortByClicksDesc会全局排序，把末尾元素也参与排序，从而可能离开末尾。
                    // 所以我们需要改造排序逻辑：在render中不全局排序，而是保持末尾元素不变，对前面的元素排序。
                    // 但点击次数显示需要实时更新，排序前需要先更新clicks，然后重新排序除最后一个元素外的部分。
                    // 为了清晰，我将移动和排序逻辑抽离为单独函数，在点击事件中调用。

                    // 但为了不让代码过于复杂，我采用以下方式：点击后，currentItem.clicks+1，从数组中移除并push到末尾。
                    // 然后重新渲染时，render函数会按点击次数降序排序整个数组，这样currentItem可能因为clicks增加而排在前面，就违背了“排到末尾”。
                    // 所以需要特殊处理：在render中，如果检测到某个链接被标记为“强制末尾”，则固定它。
                    // 可以使用一个forceLastUrl集合，但过于复杂。

                    // 我决定简化需求解读：用户可能只是想要“点击链接后，该链接移动到列表末尾（视觉上的20个链接的末尾）”，
                    // 同时链接的点击次数+1，并且列表仍然按点击次数降序排列显示Top10？但那样点击后它可能不是末尾。
                    // 如果必须两者兼得，只能将“移动到末尾”理解为用户点击后，链接在DOM中移动到末尾，但排序后位置会变？那用户看到的就是它跑到了别处，不符合预期。

                    // 重新看需求原文：“html功能是20个链接显示top10排列的网站链接，点击其中一个链接，这个链接自动排到20个链接的末尾”
                    // 可能意思是：页面上有20个链接，默认按点击次数（或某种排名）显示Top10排列（即前10名有特殊标识），
                    // 点击某个链接后，这个链接会被移到列表的最后一位（第20位），同时它的点击次数增加？
                    // 但这样Top10标识会变化，被点击的链接可能从Top10掉出，符合直觉。

                    // 因此最终方案：点击链接后，该链接移动到数组末尾，点击次数+1，其他19个链接按点击次数降序排序（Top10仍然标识前10个），最后一个固定为点击的链接。
                    // 在render中体现为：先分离最后一个元素，对剩余19个排序，然后合并。但点击时我们需要先设置好数组结构。
                    // 为了避免混乱，我在点击事件中直接重新组织linksData，然后调用render，render不再排序，而是相信linksData的顺序已经是最终顺序。
                    // 但其他情况如重置时需要排序。所以我在render中不再排序，而是提供一个外部排序函数。
                    // 为了可维护性，我将在点击事件中完成所有排序逻辑，然后调用render直接使用linksData顺序。

                    // 重新梳理：
                    // 1. 每个链接对象有 clicks 属性。
                    // 2. 点击链接时：该链接 clicks+1。
                    // 3. 从 linksData 中移除该链接。
                    // 4. 对剩余 linksData 按 clicks 降序排序（稳定排序）。
                    // 5. 将被点击链接 push 到 linksData 末尾。
                    // 6. 调用 render（render内部不再排序，直接渲染 linksData 顺序）。
                    // 这样，被点击链接永远在末尾，其他链接按点击次数排序。完美满足需求。

                    // 所以，修改点击处理逻辑如下：
                    // 但这里我直接在点击事件中完成，但要注意link的点击事件会同时触发跳转，需要确保数据先更新。

                    // 由于点击事件可能很快跳转（新标签页），当前页面的JS会在跳转前执行完成。没问题。

                    // 下面开始执行上述步骤：
                    // (1) 已经currentItem.clicks += 1
                    // (2) 从 linksData 中移除
                    const indexInArray = linksData.indexOf(currentItem);
                    if (indexInArray > -1) {
                        linksData.splice(indexInArray, 1);
                    }

                    // (3) 对剩余 linksData 按 clicks 降序排序（稳定）
                    linksData.sort((a, b) => {
                        if (b.clicks !== a.clicks) return b.clicks - a.clicks;
                        return 0; // 稳定排序依赖V8引擎的稳定排序，或自己维护索引，这里简单处理
                    });
                    // 注意：现代 JS 引擎 sort 是稳定的，所以相同 clicks 会保持相对顺序。

                    // (4) 将被点击链接 push 到最后
                    linksData.push(currentItem);

                    // (5) 重新渲染，render 内部不再排序
                    render(false); // 传入 false 表示不自动排序
                });

                // 点击计数
                const counter = document.createElement('span');
                counter.className = 'click-counter';
                counter.textContent = `${item.clicks} 次`;

                // 组装
                li.appendChild(badge);
                li.appendChild(link);
                li.appendChild(counter);

                listEl.appendChild(li);
            });
        }

        // ---------- 渲染函数（可选排序） ----------
        // 如果 autoSort 为 true，先按点击次数降序排序（稳定）
        function render(autoSort = true) {
            if (!listEl) return;

            if (autoSort) {
                // 稳定排序: 使用 _index 辅助
                linksData = linksData
                    .map((item, idx) => ({ ...item, _idx: idx }))
                    .sort((a, b) => {
                        if (b.clicks !== a.clicks) return b.clicks - a.clicks;
                        return a._idx - b._idx;
                    })
                    .map(({ _idx, ...rest }) => rest);
            }

            // 清空列表
            listEl.innerHTML = '';

            // 渲染
            linksData.forEach((item, index) => {
                const rank = index + 1;
                const isTop10 = rank <= 10;

                const li = document.createElement('li');
                li.className = 'link-item' + (isTop10 ? ' is-top10' : '');
                li.dataset.rank = rank;

                const badge = document.createElement('span');
                badge.className = 'rank-badge';
                if (rank === 1) badge.classList.add('top-1');
                else if (rank === 2) badge.classList.add('top-2');
                else if (rank === 3) badge.classList.add('top-3');
                badge.textContent = rank;

                const link = document.createElement('a');
                link.href = item.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = item.name;

                // 绑定点击事件（注意要绑定当前 item 的引用，但 item 是循环变量，需要用闭包或拷贝）
                // 由于 forEach 每次迭代创建新的作用域，item 是当前对象引用，可以安全使用。
                link.addEventListener('click', function(e) {
                    // 不阻止默认行为，保留跳转
                    // 但需要根据 url 和 name 找到 linksData 中的对象（因为 item 可能是旧引用）
                    // 更好的方式：用 dataset 记录 url，通过 url 查找。但 name 可能重复？这里 url 唯一，用 url 查找。
                    const targetUrl = this.href; // 完整 url
                    // 查找 linksData 中 url 匹配的项（可能 https 与 http，但这里数据一致）
                    const currentItem = linksData.find(d => d.url === item.url);
                    if (!currentItem) {
                        // 如果没找到（可能因为渲染后数据变化），直接返回
                        return;
                    }

                    // 1. 点击次数+1
                    currentItem.clicks += 1;

                    // 2. 从数组移除
                    const idx = linksData.indexOf(currentItem);
                    if (idx > -1) linksData.splice(idx, 1);

                    // 3. 剩余按点击次数降序排序（稳定）
                    linksData.sort((a, b) => {
                        if (b.clicks !== a.clicks) return b.clicks - a.clicks;
                        return 0; // 稳定排序
                    });

                    // 4. 将当前项 push 到末尾
                    linksData.push(currentItem);

                    // 5. 重新渲染（不自动排序，因为我们已手动排序且末尾固定）
                    render(false);
                });

                const counter = document.createElement('span');
                counter.className = 'click-counter';
                counter.textContent = `${item.clicks} 次`;

                li.appendChild(badge);
                li.appendChild(link);
                li.appendChild(counter);
                listEl.appendChild(li);
            });
        }

        // ---------- 重置数据 ----------
        function resetData() {
            linksData = INITIAL_LINKS.map(item => ({ ...item }));
            render(true); // 重新排序渲染
        }

        // ---------- 初始化 ----------
        function init() {
            render(true); // 初始排序渲染

            const resetBtn = document.getElementById('resetBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', resetData);
            }
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
