<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e1119">
  <title>手机钢琴 · 双排键 · 延音踏板</title>
  <style>
    /* ========== 基础重置 ========== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(ellipse at 50% 0%, #2a3045 0%, #141824 50%, #07090f 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ========== 横屏提示 ========== */
    .rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0c12;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      color: #cbd2e8;
      text-align: center;
      padding: 2rem;
    }

    .rotate-hint .icon {
      font-size: 4rem;
      animation: rotatePhone 2s ease-in-out infinite;
    }

    .rotate-hint .text {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    .rotate-hint .sub {
      font-size: 0.8rem;
      color: #7e88a8;
    }

    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* 竖屏且窄屏时显示提示 */
    @media (max-width: 700px) and (orientation: portrait) {
      .rotate-hint {
        display: flex;
      }
      .piano-wrapper {
        display: none !important;
      }
    }

    /* ========== 整体框架 ========== */
    .piano-wrapper {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 1600px;
      background: linear-gradient(180deg, #1a1e2b 0%, #0e1119 100%);
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0.6rem 0.5rem;
      gap: 0.5rem;
      overflow: hidden;
    }

    /* ========== 顶栏 ========== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      min-height: 2.2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #e8ecf8;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .brand .logo {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #5b6c9e, #2e3a5c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .hint-pill {
      color: #a8b2d1;
      font-size: 0.65rem;
      letter-spacing: 0.2px;
      background: rgba(30, 36, 56, 0.8);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      box-shadow: inset 0 -1.5px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }

    .hint-pill kbd {
      background: #3a4260;
      color: #f0e7d3;
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
      font-size: 0.6rem;
      font-weight: 600;
      border-bottom: 1px solid #1a1e2b;
      font-family: inherit;
    }

    .pedal-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(30, 36, 56, 0.8);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      box-shadow: inset 0 -1.5px 0 rgba(0, 0, 0, 0.3);
    }

    .pedal-status .label {
      color: #a8b2d1;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2e3448;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: all 0.12s ease;
    }

    .led.on {
      background: #ffb347;
      box-shadow: 0 0 10px rgba(255, 179, 71, 0.8), inset 0 0 3px rgba(255, 248, 224, 0.9);
    }

    /* ========== 双排键盘区域 ========== */
    .keyboard-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      overflow: hidden;
    }

    .row-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding-left: 0.2rem;
      height: 0.9rem;
      flex-shrink: 0;
    }

    .row-label span {
      color: #6b7490;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .row-label .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(107, 116, 144, 0.3), transparent);
    }

    /* 单排键盘 */
    .keyboard-row {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #0a0c12 0%, #12151f 100%);
      border-radius: 0.4rem;
      padding: 0 2px 2px;
      box-shadow:
        inset 0 -4px 0 #05070b,
        inset 0 3px 8px rgba(0, 0, 0, 0.6),
        0 4px 12px rgba(0, 0, 0, 0.5);
      min-height: 0;
      overflow: hidden;
      /* 关键：横向滚动 */
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .keyboard-row::-webkit-scrollbar {
      display: none;
    }

    /* 键盘内容（绝对定位） */
    .keys-inner {
      position: relative;
      height: 100%;
      min-height: 80px;
    }

    /* ========== 白键（加大） ========== */
    .white-key {
      position: absolute;
      top: 0;
      height: 100%;
      background: linear-gradient(180deg, #faf8f2 0%, #f0ece0 40%, #e2ddd0 100%);
      border-radius: 0 0 5px 5px;
      border: 1px solid #a8a192;
      border-top: none;
      box-shadow:
        inset 0 -6px 5px rgba(0, 0, 0, 0.06),
        inset 0 5px 5px rgba(255, 255, 255, 0.8),
        0 3px 0 #6e685c,
        0 4px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.04s ease, box-shadow 0.04s ease, background 0.04s ease;
      cursor: pointer;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 4px;
    }

    .white-key.active {
      transform: translateY(3px);
      background: linear-gradient(180deg, #e8e2d2 0%, #d8d2c2 100%);
      box-shadow:
        inset 0 -2px 3px rgba(0, 0, 0, 0.12),
        inset 0 2px 3px rgba(255, 255, 255, 0.9),
        0 1px 0 #5a5448,
        0 3px 6px rgba(0, 0, 0, 0.35);
    }

    .white-key .note-label {
      font-size: 8px;
      color: #7a7466;
      font-weight: 700;
      letter-spacing: 0.1px;
      background: rgba(200, 190, 170, 0.25);
      padding: 1px 3px;
      border-radius: 4px;
      opacity: 0.7;
      transition: 0.1s;
      pointer-events: none;
      line-height: 1.1;
    }

    .white-key.active .note-label {
      color: #2f2b22;
      background: rgba(160, 150, 130, 0.5);
      opacity: 1;
    }

    /* ========== 黑键（加宽） ========== */
    .black-key {
      position: absolute;
      top: 0;
      height: 62%;
      background: linear-gradient(180deg, #2a2c32 0%, #1a1c22 50%, #0e0f12 100%);
      border-radius: 0 0 4px 4px;
      border: 1px solid #000000;
      border-top: none;
      box-shadow:
        inset 0 -3px 3px rgba(255, 255, 255, 0.08),
        inset 0 2px 3px rgba(255, 255, 255, 0.15),
        0 4px 0 #000000,
        0 5px 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.04s ease, box-shadow 0.04s ease, background 0.04s ease;
      cursor: pointer;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 3px;
    }

    .black-key.active {
      transform: translateY(3px);
      background: linear-gradient(180deg, #3e4048 0%, #23252b 100%);
      box-shadow:
        inset 0 -2px 3px rgba(255, 255, 255, 0.15),
        inset 0 2px 3px rgba(255, 255, 255, 0.2),
        0 1px 0 #000000,
        0 3px 6px rgba(0, 0, 0, 0.6);
    }

    .black-key .note-label {
      font-size: 7px;
      color: #b0b0b8;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 2px;
      border-radius: 3px;
      pointer-events: none;
      line-height: 1.1;
    }

    .black-key.active .note-label {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
    }

    /* ========== 底部控制栏（踏板） ========== */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-shrink: 0;
      padding: 0.3rem 0 0.1rem;
    }

    .pedal-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: transform 0.06s ease;
    }

    .pedal-button:active {
      transform: scale(0.97);
    }

    .pedal-pad {
      width: 120px;
      height: 40px;
      background: linear-gradient(160deg, #2a3045, #1a1e2e);
      border-radius: 40px;
      box-shadow:
        inset 0 -5px 0 #0b0e16,
        0 6px 0 #080a10,
        0 10px 16px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.06s ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .pedal-pad::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
      border-radius: 40px 40px 0 0;
      pointer-events: none;
    }

    .pedal-button.active .pedal-pad {
      transform: translateY(5px);
      box-shadow:
        inset 0 -2px 0 #0b0e16,
        0 1px 0 #080a10,
        0 4px 10px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      background: linear-gradient(160deg, #3a4563, #232a3e);
    }

    .pedal-pad span {
      color: #d0d8f0;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      z-index: 1;
      transition: 0.06s;
    }

    .pedal-button.active .pedal-pad span {
      color: #ffcd7e;
      text-shadow: 0 0 8px rgba(255, 179, 71, 0.5);
    }

    .pedal-label {
      color: #7e88a8;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      background: rgba(20, 24, 36, 0.6);
      padding: 0.15rem 0.8rem;
      border-radius: 16px;
      transition: 0.1s;
    }

    .pedal-button.active .pedal-label {
      color: #ffcd7e;
    }

    /* ========== 横屏适配（手机横屏） ========== */
    @media (orientation: landscape) and (max-height: 500px) {
      .piano-wrapper {
        padding: 0.3rem 0.4rem;
        gap: 0.3rem;
      }

      .top-bar {
        min-height: 1.6rem;
      }

      .brand {
        font-size: 0.7rem;
      }

      .brand .logo {
        width: 20px;
        height: 20px;
        font-size: 0.65rem;
      }

      .hint-pill {
        display: none;
      }

      .pedal-status {
        padding: 0.2rem 0.5rem;
      }

      .pedal-status .label {
        font-size: 0.55rem;
      }

      .led {
        width: 7px;
        height: 7px;
      }

      .row-label {
        height: 0.7rem;
      }

      .row-label span {
        font-size: 0.5rem;
      }

      .keyboard-container {
        gap: 3px;
      }

      .bottom-bar {
        padding: 0.2rem 0 0;
      }

      .pedal-pad {
        width: 100px;
        height: 32px;
      }

      .pedal-pad span {
        font-size: 0.65rem;
        letter-spacing: 2px;
      }

      .pedal-label {
        font-size: 0.5rem;
        padding: 0.1rem 0.6rem;
      }
    }

    /* 横屏且屏幕较高时，双排键各占更多空间 */
    @media (orientation: landscape) and (min-height: 500px) {
      .piano-wrapper {
        padding: 0.6rem 0.8rem;
      }

      .keyboard-container {
        gap: 6px;
      }
    }

    /* 超宽屏（平板横屏） */
    @media (orientation: landscape) and (min-width: 900px) {
      .piano-wrapper {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0.8rem 1rem;
      }

      .keyboard-container {
        gap: 8px;
      }
    }

    /* ========== 动画 ========== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .piano-wrapper {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- 横屏提示 -->
  <div class="rotate-hint" id="rotateHint">
    <div class="icon">📱</div>
    <div class="text">请横屏使用<br>获得最佳弹奏体验</div>
    <div class="sub">横屏后琴键更宽，方便手指弹奏</div>
  </div>

  <!-- 主界面 -->
  <div class="piano-wrapper" id="pianoWrapper">
    <!-- 顶栏 -->
    <div class="top-bar">
      <div class="brand">
        <span class="logo">🎹</span>
        <span>Mobile Piano</span>
      </div>
      <div class="hint-pill">
        <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd>
        <span style="opacity:0.6;margin-left:0.2rem;">中音区</span>
      </div>
      <div class="pedal-status">
        <span class="label">Sustain</span>
        <div class="led" id="pedalLed"></div>
      </div>
    </div>

    <!-- 双排键盘 -->
    <div class="keyboard-container">
      <!-- 上排：高音区 C5-B5 -->
      <div class="row-label">
        <span>高音区</span>
        <div class="line"></div>
      </div>
      <div class="keyboard-row" id="rowUpper">
        <div class="keys-inner" id="keysUpper"></div>
      </div>

      <!-- 下排：中音区 C4-B4 -->
      <div class="row-label">
        <span>中音区</span>
        <div class="line"></div>
      </div>
      <div class="keyboard-row" id="rowLower">
        <div class="keys-inner" id="keysLower"></div>
      </div>
    </div>

    <!-- 踏板 -->
    <div class="bottom-bar">
      <div class="pedal-button" id="sustainPedal">
        <div class="pedal-pad">
          <span>SUSTAIN</span>
        </div>
        <div class="pedal-label">延音踏板</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================================================
      // 1. 音频引擎
      // ============================================================
      let audioCtx = null;
      let masterGain = null;
      let pedalDown = false;
      const activeVoices = [];
      const pressedMidiSet = new Set();

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.6;
        masterGain.connect(audioCtx.destination);
      }

      function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      function midiToName(midi) {
        const octave = Math.floor(midi / 12) - 1;
        return NOTE_NAMES[midi % 12] + octave;
      }

      // ============================================================
      // 2. 音色合成
      // ============================================================
      function playNote(midi) {
        if (!audioCtx) initAudio();
        if (!audioCtx) return;
        resumeAudio();

        const freq = midiToFreq(midi);
        const now = audioCtx.currentTime;

        const noteGain = audioCtx.createGain();
        noteGain.gain.setValueAtTime(0, now);

        const attack = 0.005;
        const decay = pedalDown ? 3.5 : 1.2;
        const sustainLevel = 0.1;
        const peak = 0.85;

        noteGain.gain.linearRampToValueAtTime(peak, now + attack);
        noteGain.gain.exponentialRampToValueAtTime(sustainLevel, now + attack + decay * 0.5);
        noteGain.gain.exponentialRampToValueAtTime(0.001, now + attack + decay);

        const oscillators = [];

        const osc1 = audioCtx.createOscillator();
        osc1.type = 'triangle';
        osc1.frequency.value = freq;
        osc1.connect(noteGain);
        osc1.start(now);
        oscillators.push(osc1);

        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2;
        osc2.detune.value = 2;
        const gain2 = audioCtx.createGain();
        gain2.gain.value = 0.25;
        osc2.connect(gain2);
        gain2.connect(noteGain);
        osc2.start(now);
        oscillators.push(osc2);

        const osc3 = audioCtx.createOscillator();
        osc3.type = 'sine';
        osc3.frequency.value = freq * 3;
        osc3.detune.value = -1;
        const gain3 = audioCtx.createGain();
        gain3.gain.value = 0.1;
        osc3.connect(gain3);
        gain3.connect(noteGain);
        osc3.start(now);
        oscillators.push(osc3);

        noteGain.connect(masterGain);

        const voice = {
          midi,
          noteGain,
          oscillators,
          startTime: now,
          released: false,
          stopTimeout: null
        };

        activeVoices.push(voice);

        const autoStopDelay = (attack + decay + 0.3) * 1000;
        voice.stopTimeout = setTimeout(() => {
          if (!pedalDown && !voice.released) {
            releaseVoice(voice, 0.08);
          }
        }, autoStopDelay);

        let stoppedCount = 0;
        oscillators.forEach(osc => {
          osc.onended = () => {
            stoppedCount++;
            if (stoppedCount === oscillators.length) {
              const idx = activeVoices.indexOf(voice);
              if (idx !== -1) activeVoices.splice(idx, 1);
            }
          };
        });

        return voice;
      }

      function releaseVoice(voice, fadeTime = 0.1) {
        if (!voice || voice.released) return;
        voice.released = true;
        const now = audioCtx.currentTime;
        const gain = voice.noteGain.gain;

        try {
          gain.cancelScheduledValues(now);
          gain.setValueAtTime(gain.value, now);
          gain.exponentialRampToValueAtTime(0.001, now + fadeTime);
        } catch (e) {}

        voice.oscillators.forEach(osc => {
          try { osc.stop(now + fadeTime + 0.03); } catch (e) {}
        });

        if (voice.stopTimeout) {
          clearTimeout(voice.stopTimeout);
          voice.stopTimeout = null;
        }
      }

      function releaseUntouchedVoices() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        activeVoices.forEach(voice => {
          if (!pressedMidiSet.has(voice.midi) && !voice.released) {
            try {
              voice.noteGain.gain.cancelScheduledValues(now);
              voice.noteGain.gain.setValueAtTime(voice.noteGain.gain.value, now);
              voice.noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            } catch (e) {}
            voice.oscillators.forEach(osc => {
              try { osc.stop(now + 0.18); } catch (e) {}
            });
            voice.released = true;
          }
        });
      }

      // ============================================================
      // 3. 构建双排键盘
      // ============================================================

      // 手机适配：每排显示一个八度 + 一个额外音符（共13个半音），但为了完整感，我们建两排完整八度
      // 上排：C5 (72) 到 B5 (83) —— 高音区
      // 下排：C4 (60) 到 B4 (71) —— 中音区
      // 每个八度12个半音，7白5黑

      const WHITE_KEY_WIDTH_MOBILE = 44;  // 手机加宽白键
      const BLACK_KEY_WIDTH_MOBILE = 28;  // 黑键加宽
      const BLACK_MIDI_SET = new Set([1, 3, 6, 8, 10]);

      // 上排 MIDI 范围：C5 (72) 到 B5 (83)
      // 下排 MIDI 范围：C4 (60) 到 B4 (71)

      const rowConfigs = [
        { id: 'keysUpper', startMidi: 72, endMidi: 83, label: '高音区' },
        { id: 'keysLower', startMidi: 60, endMidi: 71, label: '中音区' }
      ];

      const allKeyElementsByMidi = new Map();

      rowConfigs.forEach(config => {
        const container = document.getElementById(config.id);
        if (!container) return;

        const startMidi = config.startMidi;
        const endMidi = config.endMidi;

        // 统计白键数量
        let whiteCount = 0;
        for (let midi = startMidi; midi <= endMidi; midi++) {
          if (!BLACK_MIDI_SET.has(midi % 12)) whiteCount++;
        }

        const totalWidth = whiteCount * WHITE_KEY_WIDTH_MOBILE;
        container.style.width = totalWidth + 'px';
        container.style.height = '100%';

        // 创建键
        let whiteIndex = 0;
        const whiteKeyMap = new Map();

        for (let midi = startMidi; midi <= endMidi; midi++) {
          const isBlack = BLACK_MIDI_SET.has(midi % 12);
          const noteName = midiToName(midi);

          const keyEl = document.createElement('div');
          keyEl.dataset.midi = midi;
          keyEl.dataset.note = noteName;

          const label = document.createElement('span');
          label.className = 'note-label';
          label.textContent = noteName;
          keyEl.appendChild(label);

          if (!isBlack) {
            keyEl.className = 'white-key';
            const left = whiteIndex * WHITE_KEY_WIDTH_MOBILE;
            keyEl.style.left = left + 'px';
            keyEl.style.width = WHITE_KEY_WIDTH_MOBILE + 'px';
            keyEl.style.height = '100%';
            whiteKeyMap.set(midi, { left, width: WHITE_KEY_WIDTH_MOBILE });
            whiteIndex++;
          } else {
            keyEl.className = 'black-key';
            keyEl.style.width = BLACK_KEY_WIDTH_MOBILE + 'px';
            keyEl.style.height = '62%';
            keyEl.dataset.pendingBlack = 'true';
          }

          container.appendChild(keyEl);
          allKeyElementsByMidi.set(midi, keyEl);
        }

        // 计算黑键位置
        for (let midi = startMidi; midi <= endMidi; midi++) {
          if (!BLACK_MIDI_SET.has(midi % 12)) continue;
          const keyEl = allKeyElementsByMidi.get(midi);
          if (!keyEl) continue;

          const leftWhiteMidi = midi - 1;
          const leftWhiteInfo = whiteKeyMap.get(leftWhiteMidi);
          if (leftWhiteInfo) {
            const left = leftWhiteInfo.left + leftWhiteInfo.width - BLACK_KEY_WIDTH_MOBILE / 2;
            keyEl.style.left = left + 'px';
          } else {
            keyEl.style.left = '0px';
          }
          delete keyEl.dataset.pendingBlack;
        }
      });

      // ============================================================
      // 4. 交互逻辑
      // ============================================================

      function handlePointerDown(midi, element, e) {
        e.preventDefault();
        initAudio();
        resumeAudio();

        if (pressedMidiSet.has(midi)) return;
        pressedMidiSet.add(midi);
        element.classList.add('active');
        playNote(midi);

        try { element.setPointerCapture(e.pointerId); } catch (err) {}
      }

      function handlePointerUp(midi, element, e) {
        e.preventDefault();

        if (pressedMidiSet.has(midi)) {
          pressedMidiSet.delete(midi);
          element.classList.remove('active');

          if (!pedalDown) {
            for (let i = activeVoices.length - 1; i >= 0; i--) {
              const voice = activeVoices[i];
              if (voice.midi === midi && !voice.released) {
                releaseVoice(voice, 0.08);
              }
            }
          }
        }

        try { element.releasePointerCapture(e.pointerId); } catch (err) {}
      }

      // 绑定所有琴键
      allKeyElementsByMidi.forEach((el, midi) => {
        el.addEventListener('pointerdown', (e) => handlePointerDown(midi, el, e));
        el.addEventListener('pointerup', (e) => handlePointerUp(midi, el, e));
        el.addEventListener('pointercancel', (e) => handlePointerUp(midi, el, e));
        el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
      });

      // ============================================================
      // 5. 电脑键盘映射（手机外接键盘也可用）
      // ============================================================
      const KEY_MAP = {
        'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65,
        't': 66, 'g': 67, 'y': 68, 'h': 69, 'u': 70, 'j': 71
      };

      const keyboardPressed = new Set();

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (!(key in KEY_MAP)) return;
        e.preventDefault();

        if (keyboardPressed.has(key)) return;
        keyboardPressed.add(key);

        const midi = KEY_MAP[key];
        const el = allKeyElementsByMidi.get(midi);
        if (!el) return;
        if (pressedMidiSet.has(midi)) return;

        initAudio();
        resumeAudio();
        pressedMidiSet.add(midi);
        el.classList.add('active');
        playNote(midi);
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (!(key in KEY_MAP)) return;
        e.preventDefault();

        if (!keyboardPressed.has(key)) return;
        keyboardPressed.delete(key);

        const midi = KEY_MAP[key];
        const el = allKeyElementsByMidi.get(midi);
        if (!el) return;

        if (pressedMidiSet.has(midi)) {
          pressedMidiSet.delete(midi);
          el.classList.remove('active');

          if (!pedalDown) {
            for (let i = activeVoices.length - 1; i >= 0; i--) {
              const voice = activeVoices[i];
              if (voice.midi === midi && !voice.released) {
                releaseVoice(voice, 0.08);
              }
            }
          }
        }
      });

      // ============================================================
      // 6. 延音踏板
      // ============================================================
      const pedalButton = document.getElementById('sustainPedal');
      const pedalLed = document.getElementById('pedalLed');

      function setPedal(down) {
        if (pedalDown === down) return;
        pedalDown = down;

        if (down) {
          pedalLed.classList.add('on');
          pedalButton.classList.add('active');

          if (audioCtx) {
            const now = audioCtx.currentTime;
            activeVoices.forEach(voice => {
              if (!voice.released) {
                try {
                  const gain = voice.noteGain.gain;
                  gain.cancelScheduledValues(now);
                  gain.setValueAtTime(gain.value, now);
                  gain.exponentialRampToValueAtTime(0.001, now + 3.5);
                } catch (e) {}
              }
            });
          }
        } else {
          pedalLed.classList.remove('on');
          pedalButton.classList.remove('active');
          releaseUntouchedVoices();
        }
      }

      pedalButton.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        initAudio();
        resumeAudio();
        setPedal(true);
        try { pedalButton.setPointerCapture(e.pointerId); } catch (err) {}
      });

      pedalButton.addEventListener('pointerup', (e) => {
        e.preventDefault();
        setPedal(false);
        try { pedalButton.releasePointerCapture(e.pointerId); } catch (err) {}
      });

      pedalButton.addEventListener('pointercancel', () => setPedal(false));
      pedalButton.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

      // ============================================================
      // 7. 失焦释放
      // ============================================================
      window.addEventListener('blur', () => {
        allKeyElementsByMidi.forEach(el => el.classList.remove('active'));
        pressedMidiSet.clear();
        keyboardPressed.clear();

        if (audioCtx) {
          activeVoices.slice().forEach(voice => {
            if (!voice.released) releaseVoice(voice, 0.1);
          });
        }
        setPedal(false);
      });

      // ============================================================
      // 8. 自动滚动到中间位置
      // ============================================================
      setTimeout(() => {
        ['rowUpper', 'rowLower'].forEach(rowId => {
          const row = document.getElementById(rowId);
          if (!row) return;
          const inner = row.querySelector('.keys-inner');
          if (!inner) return;
          const containerWidth = row.clientWidth;
          const scrollWidth = inner.scrollWidth;
          if (scrollWidth > containerWidth) {
            row.scrollLeft = (scrollWidth - containerWidth) / 2;
          }
        });
      }, 200);

      // ============================================================
      // 9. 防止页面滚动
      // ============================================================
      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('.keyboard-row')) return;
        e.preventDefault();
      }, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (e.key in KEY_MAP || e.key === ' ') {
          e.preventDefault();
        }
      }, { passive: false });

    })();
  </script>
</body>
</html>
