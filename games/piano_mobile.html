<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0e1119">
  <title>88键手机钢琴 · 双排键 · 延音踏板</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background: #07090f;
    }

    body {
      background: radial-gradient(ellipse at 50% 0%, #2a3045 0%, #141824 50%, #07090f 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 横屏提示 */
    .rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0c12;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      color: #cbd2e8;
      text-align: center;
      padding: 2rem;
    }
    .rotate-hint .icon {
      font-size: 4rem;
      animation: rotatePhone 2s ease-in-out infinite;
    }
    .rotate-hint .text {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1.6;
    }
    .rotate-hint .sub {
      font-size: 0.8rem;
      color: #7e88a8;
    }
    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    @media (max-width: 700px) and (orientation: portrait) {
      .rotate-hint { display: flex; }
      .piano-wrapper { display: none !important; }
    }

    /* 整体框架 */
    .piano-wrapper {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 1800px;
      background: linear-gradient(180deg, #1a1e2b 0%, #0e1119 100%);
      display: flex;
      flex-direction: column;
      padding: 0.4rem 0.5rem 0.4rem;
      gap: 0.35rem;
      overflow: hidden;
    }

    /* 顶栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      min-height: 1.8rem;
      padding: 0 0.2rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: #e8ecf8;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
    }
    .brand .logo {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: linear-gradient(135deg, #5b6c9e, #2e3a5c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .hint-pill {
      color: #a8b2d1;
      font-size: 0.6rem;
      letter-spacing: 0.2px;
      background: rgba(30, 36, 56, 0.8);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      box-shadow: inset 0 -1.5px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
    }
    .hint-pill kbd {
      background: #3a4260;
      color: #f0e7d3;
      padding: 0.03rem 0.25rem;
      border-radius: 3px;
      font-size: 0.55rem;
      font-weight: 600;
      border-bottom: 1px solid #1a1e2b;
      font-family: inherit;
    }
    .pedal-status {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(30, 36, 56, 0.8);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      box-shadow: inset 0 -1.5px 0 rgba(0, 0, 0, 0.3);
    }
    .pedal-status .label {
      color: #a8b2d1;
      font-size: 0.55rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2e3448;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: all 0.12s ease;
    }
    .led.on {
      background: #ffb347;
      box-shadow: 0 0 10px rgba(255, 179, 71, 0.8), inset 0 0 3px rgba(255, 248, 224, 0.9);
    }

    /* 双排键盘区域 */
    .keyboard-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 0;
      overflow: hidden;
    }
    .row-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding-left: 0.15rem;
      height: 0.7rem;
      flex-shrink: 0;
    }
    .row-label span {
      color: #6b7490;
      font-size: 0.5rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .row-label .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(107, 116, 144, 0.3), transparent);
    }

    /* 单排键盘 - 可横向滚动 */
    .keyboard-row {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #0a0c12 0%, #12151f 100%);
      border-radius: 0.35rem;
      padding: 0 2px 2px;
      box-shadow:
        inset 0 -4px 0 #05070b,
        inset 0 3px 8px rgba(0, 0, 0, 0.6),
        0 4px 12px rgba(0, 0, 0, 0.5);
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      /* 关键：防止触摸事件被浏览器吞掉，提升多点触控响应 */
      touch-action: pan-x;
    }
    .keyboard-row::-webkit-scrollbar {
      display: none;
    }

    .keys-inner {
      position: relative;
      height: 100%;
      min-height: 70px;
      /* 右侧留白，防止最右键贴边 */
      padding-right: 30px;
    }

    /* 白键 */
    .white-key {
      position: absolute;
      top: 0;
      height: 100%;
      background: linear-gradient(180deg, #faf8f2 0%, #f0ece0 40%, #e2ddd0 100%);
      border-radius: 0 0 5px 5px;
      border: 1px solid #a8a192;
      border-top: none;
      box-shadow:
        inset 0 -6px 5px rgba(0, 0, 0, 0.06),
        inset 0 5px 5px rgba(255, 255, 255, 0.8),
        0 3px 0 #6e685c,
        0 4px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.04s ease, box-shadow 0.04s ease, background 0.04s ease;
      cursor: pointer;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 3px;
      /* 关键：允许触摸穿透到元素，不被滚动容器吞掉 */
      touch-action: none;
    }
    .white-key.active {
      transform: translateY(3px);
      background: linear-gradient(180deg, #e8e2d2 0%, #d8d2c2 100%);
      box-shadow:
        inset 0 -2px 3px rgba(0, 0, 0, 0.12),
        inset 0 2px 3px rgba(255, 255, 255, 0.9),
        0 1px 0 #5a5448,
        0 3px 6px rgba(0, 0, 0, 0.35);
    }
    .white-key .note-label {
      font-size: 7px;
      color: #7a7466;
      font-weight: 700;
      letter-spacing: 0.1px;
      background: rgba(200, 190, 170, 0.25);
      padding: 1px 2px;
      border-radius: 3px;
      opacity: 0.6;
      transition: 0.1s;
      pointer-events: none;
      line-height: 1.1;
    }
    .white-key.active .note-label {
      color: #2f2b22;
      background: rgba(160, 150, 130, 0.5);
      opacity: 1;
    }

    /* 黑键 */
    .black-key {
      position: absolute;
      top: 0;
      height: 62%;
      background: linear-gradient(180deg, #2a2c32 0%, #1a1c22 50%, #0e0f12 100%);
      border-radius: 0 0 4px 4px;
      border: 1px solid #000000;
      border-top: none;
      box-shadow:
        inset 0 -3px 3px rgba(255, 255, 255, 0.08),
        inset 0 2px 3px rgba(255, 255, 255, 0.15),
        0 4px 0 #000000,
        0 5px 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.04s ease, box-shadow 0.04s ease, background 0.04s ease;
      cursor: pointer;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 2px;
      touch-action: none;
    }
    .black-key.active {
      transform: translateY(3px);
      background: linear-gradient(180deg, #3e4048 0%, #23252b 100%);
      box-shadow:
        inset 0 -2px 3px rgba(255, 255, 255, 0.15),
        inset 0 2px 3px rgba(255, 255, 255, 0.2),
        0 1px 0 #000000,
        0 3px 6px rgba(0, 0, 0, 0.6);
    }
    .black-key .note-label {
      font-size: 6px;
      color: #b0b0b8;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 2px;
      border-radius: 3px;
      pointer-events: none;
      line-height: 1.1;
    }
    .black-key.active .note-label {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
    }

    /* 底部控制栏 */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      flex-shrink: 0;
      padding: 0.15rem 0 0;
    }
    .pedal-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.06s ease;
      touch-action: none;
    }
    .pedal-button:active {
      transform: scale(0.97);
    }
    .pedal-pad {
      width: 110px;
      height: 36px;
      background: linear-gradient(160deg, #2a3045, #1a1e2e);
      border-radius: 36px;
      box-shadow:
        inset 0 -5px 0 #0b0e16,
        0 5px 0 #080a10,
        0 9px 14px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.06s ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }
    .pedal-pad::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
      border-radius: 36px 36px 0 0;
      pointer-events: none;
    }
    .pedal-button.active .pedal-pad {
      transform: translateY(4px);
      box-shadow:
        inset 0 -2px 0 #0b0e16,
        0 1px 0 #080a10,
        0 4px 10px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      background: linear-gradient(160deg, #3a4563, #232a3e);
    }
    .pedal-pad span {
      color: #d0d8f0;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      z-index: 1;
      transition: 0.06s;
    }
    .pedal-button.active .pedal-pad span {
      color: #ffcd7e;
      text-shadow: 0 0 8px rgba(255, 179, 71, 0.5);
    }
    .pedal-label {
      color: #7e88a8;
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      background: rgba(20, 24, 36, 0.6);
      padding: 0.1rem 0.7rem;
      border-radius: 16px;
      transition: 0.1s;
    }
    .pedal-button.active .pedal-label {
      color: #ffcd7e;
    }

    /* 横屏适配 */
    @media (orientation: landscape) and (max-height: 500px) {
      .piano-wrapper { padding: 0.25rem 0.35rem; gap: 0.25rem; }
      .top-bar { min-height: 1.5rem; }
      .brand { font-size: 0.65rem; }
      .brand .logo { width: 18px; height: 18px; font-size: 0.6rem; }
      .hint-pill { display: none; }
      .pedal-status { padding: 0.2rem 0.45rem; }
      .pedal-status .label { font-size: 0.5rem; }
      .led { width: 6px; height: 6px; }
      .row-label { height: 0.6rem; }
      .row-label span { font-size: 0.45rem; }
      .keyboard-container { gap: 2px; }
      .bottom-bar { padding: 0.1rem 0 0; }
      .pedal-pad { width: 90px; height: 30px; }
      .pedal-pad span { font-size: 0.6rem; letter-spacing: 2px; }
      .pedal-label { font-size: 0.45rem; padding: 0.05rem 0.5rem; }
      .white-key .note-label { font-size: 6px; }
      .black-key .note-label { font-size: 5px; }
      .keys-inner { padding-right: 24px; }
    }

    @media (orientation: landscape) and (min-height: 500px) {
      .piano-wrapper { padding: 0.5rem 0.7rem; }
      .keyboard-container { gap: 5px; }
      .keys-inner { padding-right: 36px; }
    }

    @media (orientation: landscape) and (min-width: 900px) {
      .piano-wrapper { max-width: 1600px; margin: 0 auto; padding: 0.7rem 0.9rem; }
      .keyboard-container { gap: 7px; }
      .keys-inner { padding-right: 44px; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .piano-wrapper { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body>
  <div class="rotate-hint" id="rotateHint">
    <div class="icon">📱</div>
    <div class="text">请横屏使用<br>获得最佳弹奏体验</div>
    <div class="sub">横屏后琴键更宽，方便手指弹奏</div>
  </div>

  <div class="piano-wrapper" id="pianoWrapper">
    <div class="top-bar">
      <div class="brand">
        <span class="logo">🎹</span>
        <span>88 Key Piano</span>
      </div>
      <div class="hint-pill">
        <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd>
        <span style="opacity:0.6;margin-left:0.15rem;">中音区</span>
      </div>
      <div class="pedal-status">
        <span class="label">Sustain</span>
        <div class="led" id="pedalLed"></div>
      </div>
    </div>

    <div class="keyboard-container">
      <div class="row-label">
        <span>中高音区</span>
        <div class="line"></div>
      </div>
      <div class="keyboard-row" id="rowUpper">
        <div class="keys-inner" id="keysUpper"></div>
      </div>

      <div class="row-label">
        <span>低音区</span>
        <div class="line"></div>
      </div>
      <div class="keyboard-row" id="rowLower">
        <div class="keys-inner" id="keysLower"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="pedal-button" id="sustainPedal">
        <div class="pedal-pad">
          <span>SUSTAIN</span>
        </div>
        <div class="pedal-label">延音踏板</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================================================
      // 1. 音频引擎
      // ============================================================
      let audioCtx = null;
      let masterGain = null;
      let pedalDown = false;
      const activeVoices = [];
      const pressedMidiSet = new Set();

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.6;
        masterGain.connect(audioCtx.destination);
      }

      function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      function midiToName(midi) {
        const octave = Math.floor(midi / 12) - 1;
        return NOTE_NAMES[midi % 12] + octave;
      }

      // ============================================================
      // 2. 音色合成（延长音符衰减）
      // ============================================================
      function playNote(midi) {
        if (!audioCtx) initAudio();
        if (!audioCtx) return;
        resumeAudio();

        const freq = midiToFreq(midi);
        const now = audioCtx.currentTime;

        const noteGain = audioCtx.createGain();
        noteGain.gain.setValueAtTime(0, now);

        const attack = 0.005;
        const decay = pedalDown ? 6.0 : 2.8;
        const sustainLevel = 0.15;
        const peak = 0.85;

        noteGain.gain.linearRampToValueAtTime(peak, now + attack);
        noteGain.gain.exponentialRampToValueAtTime(sustainLevel, now + attack + decay * 0.35);
        noteGain.gain.exponentialRampToValueAtTime(0.001, now + attack + decay);

        const oscillators = [];

        const osc1 = audioCtx.createOscillator();
        osc1.type = 'triangle';
        osc1.frequency.value = freq;
        osc1.connect(noteGain);
        osc1.start(now);
        oscillators.push(osc1);

        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2;
        osc2.detune.value = 2;
        const gain2 = audioCtx.createGain();
        gain2.gain.value = 0.28;
        osc2.connect(gain2);
        gain2.connect(noteGain);
        osc2.start(now);
        oscillators.push(osc2);

        const osc3 = audioCtx.createOscillator();
        osc3.type = 'sine';
        osc3.frequency.value = freq * 3;
        osc3.detune.value = -1;
        const gain3 = audioCtx.createGain();
        gain3.gain.value = 0.12;
        osc3.connect(gain3);
        gain3.connect(noteGain);
        osc3.start(now);
        oscillators.push(osc3);

        const osc4 = audioCtx.createOscillator();
        osc4.type = 'sine';
        osc4.frequency.value = freq * 4.01;
        const gain4 = audioCtx.createGain();
        gain4.gain.value = 0.06;
        osc4.connect(gain4);
        gain4.connect(noteGain);
        osc4.start(now);
        oscillators.push(osc4);

        noteGain.connect(masterGain);

        const voice = {
          midi,
          noteGain,
          oscillators,
          startTime: now,
          released: false,
          stopTimeout: null
        };

        activeVoices.push(voice);

        const autoStopDelay = (attack + decay + 0.3) * 1000;
        voice.stopTimeout = setTimeout(() => {
          if (!pedalDown && !voice.released) {
            releaseVoice(voice, 0.1);
          }
        }, autoStopDelay);

        let stoppedCount = 0;
        oscillators.forEach(osc => {
          osc.onended = () => {
            stoppedCount++;
            if (stoppedCount === oscillators.length) {
              const idx = activeVoices.indexOf(voice);
              if (idx !== -1) activeVoices.splice(idx, 1);
            }
          };
        });

        return voice;
      }

      function releaseVoice(voice, fadeTime = 0.1) {
        if (!voice || voice.released) return;
        voice.released = true;
        const now = audioCtx.currentTime;
        const gain = voice.noteGain.gain;

        try {
          gain.cancelScheduledValues(now);
          gain.setValueAtTime(gain.value, now);
          gain.exponentialRampToValueAtTime(0.001, now + fadeTime);
        } catch (e) {}

        voice.oscillators.forEach(osc => {
          try { osc.stop(now + fadeTime + 0.03); } catch (e) {}
        });

        if (voice.stopTimeout) {
          clearTimeout(voice.stopTimeout);
          voice.stopTimeout = null;
        }
      }

      function releaseUntouchedVoices() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        activeVoices.forEach(voice => {
          if (!pressedMidiSet.has(voice.midi) && !voice.released) {
            try {
              voice.noteGain.gain.cancelScheduledValues(now);
              voice.noteGain.gain.setValueAtTime(voice.noteGain.gain.value, now);
              voice.noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            } catch (e) {}
            voice.oscillators.forEach(osc => {
              try { osc.stop(now + 0.2); } catch (e) {}
            });
            voice.released = true;
          }
        });
      }

      // ============================================================
      // 3. 构建88键双排键盘
      // ============================================================

      function getKeyWidths() {
        const vw = window.innerWidth;
        if (vw < 500) return { white: 38, black: 24 };
        if (vw < 800) return { white: 42, black: 26 };
        if (vw < 1100) return { white: 46, black: 28 };
        return { white: 50, black: 32 };
      }

      let WHITE_KEY_WIDTH = getKeyWidths().white;
      let BLACK_KEY_WIDTH = getKeyWidths().black;

      const BLACK_MIDI_SET = new Set([1, 3, 6, 8, 10]);

      const rowConfigs = [
        { id: 'keysUpper', startMidi: 60, endMidi: 108, label: '中高音区' },
        { id: 'keysLower', startMidi: 21, endMidi: 59, label: '低音区' }
      ];

      const allKeyElementsByMidi = new Map();

      // 关键修复：使用 pointerdown 事件，并显式管理每个 pointerId
      // 这样支持多点触控（同时按多个键）
      const activePointers = new Map(); // pointerId -> { midi, element }

      function buildKeyboard() {
        document.getElementById('keysUpper').innerHTML = '';
        document.getElementById('keysLower').innerHTML = '';
        allKeyElementsByMidi.clear();
        activePointers.clear();

        rowConfigs.forEach(config => {
          const container = document.getElementById(config.id);
          if (!container) return;

          const startMidi = config.startMidi;
          const endMidi = config.endMidi;

          let whiteCount = 0;
          for (let midi = startMidi; midi <= endMidi; midi++) {
            if (!BLACK_MIDI_SET.has(midi % 12)) whiteCount++;
          }

          const totalWidth = whiteCount * WHITE_KEY_WIDTH;
          container.style.width = totalWidth + 'px';
          container.style.height = '100%';

          let whiteIndex = 0;
          const whiteKeyMap = new Map();

          for (let midi = startMidi; midi <= endMidi; midi++) {
            const isBlack = BLACK_MIDI_SET.has(midi % 12);
            const noteName = midiToName(midi);

            const keyEl = document.createElement('div');
            keyEl.dataset.midi = midi;
            keyEl.dataset.note = noteName;

            const label = document.createElement('span');
            label.className = 'note-label';
            label.textContent = noteName;
            keyEl.appendChild(label);

            if (!isBlack) {
              keyEl.className = 'white-key';
              const left = whiteIndex * WHITE_KEY_WIDTH;
              keyEl.style.left = left + 'px';
              keyEl.style.width = WHITE_KEY_WIDTH + 'px';
              keyEl.style.height = '100%';
              whiteKeyMap.set(midi, { left, width: WHITE_KEY_WIDTH });
              whiteIndex++;
            } else {
              keyEl.className = 'black-key';
              keyEl.style.width = BLACK_KEY_WIDTH + 'px';
              keyEl.style.height = '62%';
              keyEl.dataset.pendingBlack = 'true';
            }

            container.appendChild(keyEl);
            allKeyElementsByMidi.set(midi, keyEl);
          }

          for (let midi = startMidi; midi <= endMidi; midi++) {
            if (!BLACK_MIDI_SET.has(midi % 12)) continue;
            const keyEl = allKeyElementsByMidi.get(midi);
            if (!keyEl) continue;

            const leftWhiteMidi = midi - 1;
            const leftWhiteInfo = whiteKeyMap.get(leftWhiteMidi);
            if (leftWhiteInfo) {
              const left = leftWhiteInfo.left + leftWhiteInfo.width - BLACK_KEY_WIDTH / 2;
              keyEl.style.left = left + 'px';
            } else {
              keyEl.style.left = '0px';
            }
            delete keyEl.dataset.pendingBlack;
          }
        });

        bindKeyEvents();
      }

      // ============================================================
      // 4. 交互逻辑（支持多点触控）
      // ============================================================

      function bindKeyEvents() {
        allKeyElementsByMidi.forEach((el, midi) => {
          // 使用 pointerdown，并捕获指针
          el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            initAudio();
            resumeAudio();

            // 如果这个指针已经激活了某个键，先释放它（避免重复）
            if (activePointers.has(e.pointerId)) {
              const prev = activePointers.get(e.pointerId);
              handlePointerRelease(e.pointerId, prev.midi, prev.element);
            }

            // 如果这个 MIDI 已经被其他指针按下，则忽略（避免同一个音符重复触发）
            if (pressedMidiSet.has(midi)) {
              return;
            }

            // 记录指针
            activePointers.set(e.pointerId, { midi, element: el });
            pressedMidiSet.add(midi);
            el.classList.add('active');
            playNote(midi);

            // 捕获指针，确保后续事件派发到这个元素
            try {
              el.setPointerCapture(e.pointerId);
            } catch (err) {}
          });

          // 处理指针释放
          el.addEventListener('pointerup', (e) => {
            e.preventDefault();
            e.stopPropagation();
            handlePointerRelease(e.pointerId, midi, el);
            try {
              el.releasePointerCapture(e.pointerId);
            } catch (err) {}
          });

          el.addEventListener('pointercancel', (e) => {
            handlePointerRelease(e.pointerId, midi, el);
          });

          // 防止触摸滚动
          el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        });
      }

      function handlePointerRelease(pointerId, midi, element) {
        // 从 activePointers 中移除
        if (activePointers.has(pointerId)) {
          activePointers.delete(pointerId);
        }

        // 检查这个 MIDI 是否还被其他指针按下
        let stillPressed = false;
        for (const [, info] of activePointers) {
          if (info.midi === midi) {
            stillPressed = true;
            break;
          }
        }

        if (!stillPressed && pressedMidiSet.has(midi)) {
          pressedMidiSet.delete(midi);
          element.classList.remove('active');

          if (!pedalDown) {
            for (let i = activeVoices.length - 1; i >= 0; i--) {
              const voice = activeVoices[i];
              if (voice.midi === midi && !voice.released) {
                releaseVoice(voice, 0.12);
              }
            }
          }
        }
      }

      // ============================================================
      // 5. 电脑键盘映射
      // ============================================================
      const KEY_MAP = {
        'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65,
        't': 66, 'g': 67, 'y': 68, 'h': 69, 'u': 70, 'j': 71
      };
      const keyboardPressed = new Set();

      function bindKeyboardEvents() {
        window.addEventListener('keydown', (e) => {
          const key = e.key.toLowerCase();
          if (!(key in KEY_MAP)) return;
          e.preventDefault();
          if (keyboardPressed.has(key)) return;
          keyboardPressed.add(key);

          const midi = KEY_MAP[key];
          const el = allKeyElementsByMidi.get(midi);
          if (!el) return;
          if (pressedMidiSet.has(midi)) return;

          initAudio();
          resumeAudio();
          pressedMidiSet.add(midi);
          el.classList.add('active');
          playNote(midi);
        });

        window.addEventListener('keyup', (e) => {
          const key = e.key.toLowerCase();
          if (!(key in KEY_MAP)) return;
          e.preventDefault();
          if (!keyboardPressed.has(key)) return;
          keyboardPressed.delete(key);

          const midi = KEY_MAP[key];
          const el = allKeyElementsByMidi.get(midi);
          if (!el) return;

          if (pressedMidiSet.has(midi)) {
            pressedMidiSet.delete(midi);
            el.classList.remove('active');

            if (!pedalDown) {
              for (let i = activeVoices.length - 1; i >= 0; i--) {
                const voice = activeVoices[i];
                if (voice.midi === midi && !voice.released) {
                  releaseVoice(voice, 0.12);
                }
              }
            }
          }
        });
      }

      // ============================================================
      // 6. 延音踏板
      // ============================================================
      const pedalButton = document.getElementById('sustainPedal');
      const pedalLed = document.getElementById('pedalLed');

      function setPedal(down) {
        if (pedalDown === down) return;
        pedalDown = down;

        if (down) {
          pedalLed.classList.add('on');
          pedalButton.classList.add('active');
          if (audioCtx) {
            const now = audioCtx.currentTime;
            activeVoices.forEach(voice => {
              if (!voice.released) {
                try {
                  const gain = voice.noteGain.gain;
                  gain.cancelScheduledValues(now);
                  gain.setValueAtTime(gain.value, now);
                  gain.exponentialRampToValueAtTime(0.001, now + 6.0);
                } catch (e) {}
              }
            });
          }
        } else {
          pedalLed.classList.remove('on');
          pedalButton.classList.remove('active');
          releaseUntouchedVoices();
        }
      }

      function bindPedalEvents() {
        pedalButton.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          initAudio();
          resumeAudio();
          setPedal(true);
          try { pedalButton.setPointerCapture(e.pointerId); } catch (err) {}
        });

        pedalButton.addEventListener('pointerup', (e) => {
          e.preventDefault();
          e.stopPropagation();
          setPedal(false);
          try { pedalButton.releasePointerCapture(e.pointerId); } catch (err) {}
        });

        pedalButton.addEventListener('pointercancel', () => setPedal(false));
        pedalButton.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
      }

      // ============================================================
      // 7. 失焦释放
      // ============================================================
      function bindBlurEvent() {
        window.addEventListener('blur', () => {
          allKeyElementsByMidi.forEach(el => el.classList.remove('active'));
          pressedMidiSet.clear();
          keyboardPressed.clear();
          activePointers.clear();

          if (audioCtx) {
            activeVoices.slice().forEach(voice => {
              if (!voice.released) releaseVoice(voice, 0.1);
            });
          }
          setPedal(false);
        });
      }

      // ============================================================
      // 8. 自动滚动到常用音区
      // ============================================================
      function scrollToCommonArea() {
        const scrollTargets = [
          { rowId: 'rowUpper', midi: 72 },
          { rowId: 'rowLower', midi: 48 }
        ];

        scrollTargets.forEach(({ rowId, midi }) => {
          const row = document.getElementById(rowId);
          if (!row) return;
          const keyEl = allKeyElementsByMidi.get(midi);
          if (!keyEl) return;
          const keyLeft = keyEl.offsetLeft;
          const containerWidth = row.clientWidth;
          const scrollLeft = Math.max(0, keyLeft - containerWidth / 2 + 40);
          row.scrollLeft = scrollLeft;
        });
      }

      // ============================================================
      // 9. 窗口尺寸变化
      // ============================================================
      let resizeTimeout = null;

      function handleResize() {
        if (resizeTimeout) clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const newWidths = getKeyWidths();
          if (newWidths.white !== WHITE_KEY_WIDTH || newWidths.black !== BLACK_KEY_WIDTH) {
            WHITE_KEY_WIDTH = newWidths.white;
            BLACK_KEY_WIDTH = newWidths.black;
            const upperScroll = document.getElementById('rowUpper')?.scrollLeft || 0;
            const lowerScroll = document.getElementById('rowLower')?.scrollLeft || 0;

            buildKeyboard();
            bindKeyboardEvents();
            bindBlurEvent();

            setTimeout(() => {
              const upperRow = document.getElementById('rowUpper');
              const lowerRow = document.getElementById('rowLower');
              if (upperRow) upperRow.scrollLeft = upperScroll;
              if (lowerRow) lowerRow.scrollLeft = lowerScroll;
            }, 50);
          }
        }, 250);
      }

      // ============================================================
      // 10. 初始化
      // ============================================================
      function init() {
        buildKeyboard();
        bindKeyboardEvents();
        bindPedalEvents();
        bindBlurEvent();

        setTimeout(() => {
          scrollToCommonArea();
        }, 150);

        window.addEventListener('resize', handleResize);

        // 防止页面滚动（但允许键盘行内的横向滚动）
        document.addEventListener('touchmove', (e) => {
          if (e.target.closest('.keyboard-row')) return;
          e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
          if (e.key in KEY_MAP || e.key === ' ') {
            e.preventDefault();
          }
        }, { passive: false });
      }

      init();

    })();
  </script>
</body>
</html>
