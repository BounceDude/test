<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>88键钢琴 · 延音踏板 · 优化版</title>
  <style>
    /* ========== 基础重置 ========== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #2a3045 0%, #141824 50%, #07090f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.2rem;
      overflow: hidden;
    }

    /* ========== 整体框架 ========== */
    .piano-wrapper {
      max-width: 1440px;
      width: 100%;
      background: linear-gradient(180deg, #1a1e2b 0%, #0e1119 100%);
      border-radius: 2.2rem;
      padding: 1.4rem 1.6rem 1.2rem;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ========== 顶栏 ========== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #e8ecf8;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .brand .logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #5b6c9e, #2e3a5c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .hint-pill {
      color: #a8b2d1;
      font-size: 0.78rem;
      letter-spacing: 0.3px;
      background: rgba(30, 36, 56, 0.8);
      backdrop-filter: blur(8px);
      padding: 0.45rem 1.1rem;
      border-radius: 30px;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3), 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hint-pill kbd {
      background: #3a4260;
      color: #f0e7d3;
      padding: 0.1rem 0.45rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      border-bottom: 1.5px solid #1a1e2b;
      font-family: inherit;
    }

    .pedal-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(30, 36, 56, 0.8);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1rem;
      border-radius: 30px;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3), 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .pedal-status .label {
      color: #a8b2d1;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2e3448;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: all 0.15s ease;
    }

    .led.on {
      background: #ffb347;
      box-shadow: 0 0 14px rgba(255, 179, 71, 0.8), inset 0 0 4px rgba(255, 248, 224, 0.9);
    }

    /* ========== 键盘滚动区域 ========== */
    .keyboard-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 0.6rem;
      scrollbar-width: thin;
      scrollbar-color: #3a4260 transparent;
      border-radius: 0.8rem;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .keyboard-scroll::-webkit-scrollbar {
      height: 5px;
    }

    .keyboard-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .keyboard-scroll::-webkit-scrollbar-thumb {
      background: #3a4260;
      border-radius: 10px;
    }

    /* ========== 钢琴键盘 ========== */
    .piano-keys {
      position: relative;
      height: 240px;
      background: linear-gradient(180deg, #0a0c12 0%, #12151f 100%);
      border-radius: 0.6rem;
      padding: 0 3px 3px;
      box-shadow: inset 0 -6px 0 #05070b, inset 0 4px 12px rgba(0, 0, 0, 0.6), 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    /* ========== 白键 ========== */
    .white-key {
      position: absolute;
      top: 0;
      height: 100%;
      background: linear-gradient(180deg, #faf8f2 0%, #f0ece0 40%, #e2ddd0 100%);
      border-radius: 0 0 6px 6px;
      border: 1px solid #a8a192;
      border-top: none;
      box-shadow:
        inset 0 -8px 6px rgba(0, 0, 0, 0.06),
        inset 0 6px 6px rgba(255, 255, 255, 0.8),
        0 4px 0 #6e685c,
        0 6px 12px rgba(0, 0, 0, 0.45);
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.05s ease;
      cursor: pointer;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
    }

    .white-key.active {
      transform: translateY(4px);
      background: linear-gradient(180deg, #e8e2d2 0%, #d8d2c2 100%);
      box-shadow:
        inset 0 -3px 4px rgba(0, 0, 0, 0.12),
        inset 0 3px 4px rgba(255, 255, 255, 0.9),
        0 1px 0 #5a5448,
        0 4px 8px rgba(0, 0, 0, 0.35);
    }

    .white-key .note-label {
      font-size: 7.5px;
      color: #7a7466;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      background: rgba(200, 190, 170, 0.25);
      padding: 1px 4px;
      border-radius: 6px;
      opacity: 0.7;
      transition: 0.1s;
      pointer-events: none;
      line-height: 1.2;
    }

    .white-key.active .note-label {
      color: #2f2b22;
      background: rgba(160, 150, 130, 0.45);
      opacity: 1;
    }

    /* ========== 黑键 ========== */
    .black-key {
      position: absolute;
      top: 0;
      height: 62%;
      background: linear-gradient(180deg, #2a2c32 0%, #1a1c22 50%, #0e0f12 100%);
      border-radius: 0 0 5px 5px;
      border: 1px solid #000000;
      border-top: none;
      box-shadow:
        inset 0 -4px 4px rgba(255, 255, 255, 0.08),
        inset 0 3px 4px rgba(255, 255, 255, 0.15),
        0 5px 0 #000000,
        0 7px 12px rgba(0, 0, 0, 0.7);
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.05s ease;
      cursor: pointer;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 5px;
    }

    .black-key.active {
      transform: translateY(4px);
      background: linear-gradient(180deg, #3e4048 0%, #23252b 100%);
      box-shadow:
        inset 0 -2px 4px rgba(255, 255, 255, 0.15),
        inset 0 3px 4px rgba(255, 255, 255, 0.2),
        0 1px 0 #000000,
        0 4px 8px rgba(0, 0, 0, 0.6);
    }

    .black-key .note-label {
      font-size: 6.5px;
      color: #b0b0b8;
      font-weight: 600;
      letter-spacing: 0.1px;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 3px;
      border-radius: 4px;
      pointer-events: none;
      line-height: 1.2;
    }

    .black-key.active .note-label {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
    }

    /* ========== 踏板区域 ========== */
    .pedal-area {
      display: flex;
      justify-content: center;
      padding: 0.2rem 0 0.4rem;
    }

    .pedal-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.08s ease;
    }

    .pedal-button:active {
      transform: scale(0.97);
    }

    .pedal-pad {
      width: 130px;
      height: 50px;
      background: linear-gradient(160deg, #2a3045, #1a1e2e);
      border-radius: 50px;
      box-shadow:
        inset 0 -6px 0 #0b0e16,
        0 8px 0 #080a10,
        0 14px 20px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .pedal-pad::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
      border-radius: 50px 50px 0 0;
      pointer-events: none;
    }

    .pedal-button.active .pedal-pad {
      transform: translateY(6px);
      box-shadow:
        inset 0 -2px 0 #0b0e16,
        0 2px 0 #080a10,
        0 6px 12px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      background: linear-gradient(160deg, #3a4563, #232a3e);
    }

    .pedal-pad span {
      color: #d0d8f0;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      z-index: 1;
      transition: 0.08s;
    }

    .pedal-button.active .pedal-pad span {
      color: #ffcd7e;
      text-shadow: 0 0 8px rgba(255, 179, 71, 0.5);
    }

    .pedal-label {
      color: #7e88a8;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      background: rgba(20, 24, 36, 0.6);
      padding: 0.2rem 1rem;
      border-radius: 20px;
      transition: 0.1s;
    }

    .pedal-button.active .pedal-label {
      color: #ffcd7e;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 800px) {
      body {
        padding: 0.6rem;
      }
      .piano-wrapper {
        padding: 1rem 0.8rem 0.8rem;
        border-radius: 1.4rem;
      }
      .piano-keys {
        height: 180px;
      }
      .white-key .note-label {
        font-size: 6px;
      }
      .black-key .note-label {
        font-size: 5.5px;
      }
      .pedal-pad {
        width: 100px;
        height: 42px;
      }
      .pedal-pad span {
        font-size: 0.75rem;
        letter-spacing: 2px;
      }
      .hint-pill {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="piano-wrapper">
    <!-- 顶栏 -->
    <div class="top-bar">
      <div class="brand">
        <span class="logo">🎹</span>
        <span>Grand Piano</span>
      </div>
      <div class="hint-pill">
        <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd><kbd>T</kbd><kbd>G</kbd><kbd>Y</kbd><kbd>H</kbd><kbd>U</kbd><kbd>J</kbd>
        <span style="margin-left:0.3rem;opacity:0.6;">弹奏中音区</span>
      </div>
      <div class="pedal-status">
        <span class="label">Sustain</span>
        <div class="led" id="pedalLed"></div>
      </div>
    </div>

    <!-- 键盘滚动区域 -->
    <div class="keyboard-scroll">
      <div class="piano-keys" id="pianoKeys"></div>
    </div>

    <!-- 踏板 -->
    <div class="pedal-area">
      <div class="pedal-button" id="sustainPedal">
        <div class="pedal-pad">
          <span>SUSTAIN</span>
        </div>
        <div class="pedal-label">延音踏板</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================================================
      // 1. 音频引擎 —— 基于 Web Audio API 的钢琴合成
      // ============================================================
      let audioCtx = null;
      let masterGain = null;
      let pedalDown = false;

      // 所有活动的声音对象
      const activeVoices = [];

      // 当前按下的 MIDI 音符集合（合并键盘与指针）
      const pressedMidiSet = new Set();

      // 初始化音频上下文
      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 主音量
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.55;
        masterGain.connect(audioCtx.destination);
      }

      // 恢复音频上下文（浏览器策略）
      function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // MIDI 转频率
      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      // 音名
      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      function midiToName(midi) {
        const octave = Math.floor(midi / 12) - 1;
        return NOTE_NAMES[midi % 12] + octave;
      }

      // ============================================================
      // 2. 钢琴音色合成（多振荡器叠加 + 包络）
      // ============================================================
      /**
       * 播放一个音符
       * @param {number} midi - MIDI 音高
       * @param {boolean} isPedalEffect - 是否因踏板而延长（内部使用）
       */
      function playNote(midi) {
        if (!audioCtx) initAudio();
        if (!audioCtx) return;
        resumeAudio();

        const freq = midiToFreq(midi);
        const now = audioCtx.currentTime;

        // 该音符的独立增益节点（用于单独控制释放）
        const noteGain = audioCtx.createGain();
        noteGain.gain.setValueAtTime(0, now);

        // 根据踏板状态决定衰减时间
        // 钢琴音色：起音快，衰减由快变慢
        const attack = 0.006;
        const decay = pedalDown ? 4.5 : 1.4;
        const sustainLevel = 0.12;
        const peak = 0.9;

        // 包络设计：快速起音 → 指数衰减到 sustain → 保持（踏板时）→ 释放
        noteGain.gain.linearRampToValueAtTime(peak, now + attack);
        noteGain.gain.exponentialRampToValueAtTime(sustainLevel, now + attack + decay * 0.6);
        // 后续缓慢衰减（模拟钢琴琴弦的持续振动）
        noteGain.gain.exponentialRampToValueAtTime(0.001, now + attack + decay);

        // 多振荡器叠加，音色更丰富（模拟钢琴的泛音）
        const oscillators = [];

        // 基频（主音）
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'triangle';
        osc1.frequency.value = freq;
        osc1.detune.value = 0;
        osc1.connect(noteGain);
        osc1.start(now);
        oscillators.push(osc1);

        // 第二泛音（八度）
        const osc2 = audioCtx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2;
        osc2.detune.value = 3; // 轻微失谐，增加厚度
        const gain2 = audioCtx.createGain();
        gain2.gain.value = 0.28;
        osc2.connect(gain2);
        gain2.connect(noteGain);
        osc2.start(now);
        oscillators.push(osc2);

        // 第三泛音（五度）
        const osc3 = audioCtx.createOscillator();
        osc3.type = 'sine';
        osc3.frequency.value = freq * 3;
        osc3.detune.value = -2;
        const gain3 = audioCtx.createGain();
        gain3.gain.value = 0.12;
        osc3.connect(gain3);
        gain3.connect(noteGain);
        osc3.start(now);
        oscillators.push(osc3);

        // 第四泛音（高频泛音，增加亮度）
        const osc4 = audioCtx.createOscillator();
        osc4.type = 'sine';
        osc4.frequency.value = freq * 4.02;
        const gain4 = audioCtx.createGain();
        gain4.gain.value = 0.06;
        osc4.connect(gain4);
        gain4.connect(noteGain);
        osc4.start(now);
        oscillators.push(osc4);

        // 连接到主输出
        noteGain.connect(masterGain);

        // 存储声音对象
        const voice = {
          midi,
          noteGain,
          oscillators,
          startTime: now,
          released: false,
          stopScheduled: false
        };

        activeVoices.push(voice);

        // 安排自动停止（如果踏板没有踩下）
        const autoStopDelay = (attack + decay + 0.4) * 1000;
        voice.stopTimeout = setTimeout(() => {
          if (!pedalDown && !voice.released) {
            releaseVoice(voice, 0.08);
          }
        }, autoStopDelay);

        // 清理：所有振荡器停止后，从 activeVoices 移除
        let stoppedCount = 0;
        oscillators.forEach(osc => {
          osc.onended = () => {
            stoppedCount++;
            if (stoppedCount === oscillators.length) {
              const idx = activeVoices.indexOf(voice);
              if (idx !== -1) activeVoices.splice(idx, 1);
            }
          };
        });

        return voice;
      }

      /**
       * 释放一个声音（快速淡出并停止）
       */
      function releaseVoice(voice, fadeTime = 0.12) {
        if (!voice || voice.released) return;
        voice.released = true;
        const now = audioCtx.currentTime;
        const gain = voice.noteGain.gain;

        try {
          gain.cancelScheduledValues(now);
          gain.setValueAtTime(gain.value, now);
          gain.exponentialRampToValueAtTime(0.001, now + fadeTime);
        } catch (e) {
          // 忽略
        }

        // 安排停止所有振荡器
        voice.oscillators.forEach(osc => {
          try {
            osc.stop(now + fadeTime + 0.05);
          } catch (e) {}
        });

        // 清除自动停止定时器
        if (voice.stopTimeout) {
          clearTimeout(voice.stopTimeout);
          voice.stopTimeout = null;
        }
      }

      /**
       * 释放所有未被按住的音符（用于踏板释放）
       */
      function releaseUntouchedVoices() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        activeVoices.forEach(voice => {
          if (!pressedMidiSet.has(voice.midi) && !voice.released) {
            // 快速淡出
            try {
              voice.noteGain.gain.cancelScheduledValues(now);
              voice.noteGain.gain.setValueAtTime(voice.noteGain.gain.value, now);
              voice.noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            } catch (e) {}
            voice.oscillators.forEach(osc => {
              try { osc.stop(now + 0.2); } catch (e) {}
            });
            voice.released = true;
          }
        });
      }

      // ============================================================
      // 3. 构建88键钢琴 UI
      // ============================================================
      const START_MIDI = 21;  // A0
      const END_MIDI = 108;   // C8
      const WHITE_KEY_WIDTH = 28;
      const BLACK_KEY_WIDTH = 18;
      const BLACK_MIDI_SET = new Set([1, 3, 6, 8, 10]);

      const pianoKeysEl = document.getElementById('pianoKeys');
      const keyElementsByMidi = new Map();

      // 收集白键信息
      const whiteMidiList = [];
      for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
        if (!BLACK_MIDI_SET.has(midi % 12)) {
          whiteMidiList.push(midi);
        }
      }

      const totalWhiteWidth = whiteMidiList.length * WHITE_KEY_WIDTH;
      pianoKeysEl.style.width = totalWhiteWidth + 'px';
      pianoKeysEl.style.height = '240px';

      // 创建所有键
      let whiteIndex = 0;
      const whiteKeyMap = new Map(); // midi -> { left, width }

      for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
        const isBlack = BLACK_MIDI_SET.has(midi % 12);
        const noteName = midiToName(midi);

        const keyEl = document.createElement('div');
        keyEl.dataset.midi = midi;
        keyEl.dataset.note = noteName;

        const label = document.createElement('span');
        label.className = 'note-label';
        label.textContent = noteName;
        keyEl.appendChild(label);

        if (!isBlack) {
          // 白键
          keyEl.className = 'white-key';
          const left = whiteIndex * WHITE_KEY_WIDTH;
          keyEl.style.left = left + 'px';
          keyEl.style.width = WHITE_KEY_WIDTH + 'px';
          keyEl.style.height = '100%';

          whiteKeyMap.set(midi, { left, width: WHITE_KEY_WIDTH });
          whiteIndex++;
        } else {
          // 黑键（位置稍后计算）
          keyEl.className = 'black-key';
          keyEl.style.width = BLACK_KEY_WIDTH + 'px';
          keyEl.style.height = '62%';
          keyEl.dataset.pendingBlack = 'true';
        }

        pianoKeysEl.appendChild(keyEl);
        keyElementsByMidi.set(midi, keyEl);
      }

      // 计算黑键位置
      for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
        if (!BLACK_MIDI_SET.has(midi % 12)) continue;
        const keyEl = keyElementsByMidi.get(midi);
        if (!keyEl) continue;

        const leftWhiteMidi = midi - 1;
        const leftWhiteInfo = whiteKeyMap.get(leftWhiteMidi);
        if (leftWhiteInfo) {
          const left = leftWhiteInfo.left + leftWhiteInfo.width - BLACK_KEY_WIDTH / 2;
          keyEl.style.left = left + 'px';
        } else {
          keyEl.style.left = '0px';
        }
        delete keyEl.dataset.pendingBlack;
      }

      // ============================================================
      // 4. 交互逻辑（指针 + 键盘）
      // ============================================================

      // 指针按下处理
      function handlePointerDown(midi, element, e) {
        e.preventDefault();
        initAudio();
        resumeAudio();

        // 如果该音符已被按下（可能是键盘），则忽略
        if (pressedMidiSet.has(midi)) return;
        pressedMidiSet.add(midi);
        element.classList.add('active');
        playNote(midi);

        // 指针捕获
        try {
          element.setPointerCapture(e.pointerId);
        } catch (err) {}
      }

      // 指针释放处理
      function handlePointerUp(midi, element, e) {
        e.preventDefault();

        // 从按下集合移除（但注意键盘可能也按着同一个键，我们需要区分来源）
        // 由于键盘和指针共用 pressedMidiSet，这里简单移除。
        // 实际场景中很少同时用键盘和鼠标按同一个键，我们接受这个小瑕疵。
        if (pressedMidiSet.has(midi)) {
          pressedMidiSet.delete(midi);
          element.classList.remove('active');

          // 如果没有踏板，释放该音符
          if (!pedalDown) {
            // 找到对应的 voice 并释放
            for (let i = activeVoices.length - 1; i >= 0; i--) {
              const voice = activeVoices[i];
              if (voice.midi === midi && !voice.released) {
                releaseVoice(voice, 0.1);
              }
            }
          }
        }

        try {
          element.releasePointerCapture(e.pointerId);
        } catch (err) {}
      }

      // 为所有琴键绑定指针事件
      keyElementsByMidi.forEach((el, midi) => {
        el.addEventListener('pointerdown', (e) => handlePointerDown(midi, el, e));
        el.addEventListener('pointerup', (e) => handlePointerUp(midi, el, e));
        el.addEventListener('pointercancel', (e) => handlePointerUp(midi, el, e));

        // 阻止触摸滚动
        el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
      });

      // ============================================================
      // 5. 电脑键盘映射（中音区 C4-B4）
      // ============================================================
      const KEY_MAP = {
        'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65,
        't': 66, 'g': 67, 'y': 68, 'h': 69, 'u': 70, 'j': 71
      };

      const keyboardPressed = new Set();

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (!(key in KEY_MAP)) return;
        e.preventDefault();

        if (keyboardPressed.has(key)) return;
        keyboardPressed.add(key);

        const midi = KEY_MAP[key];
        const el = keyElementsByMidi.get(midi);
        if (!el) return;

        // 如果已经因指针按下而激活，不重复发声
        if (pressedMidiSet.has(midi)) return;

        initAudio();
        resumeAudio();
        pressedMidiSet.add(midi);
        el.classList.add('active');
        playNote(midi);
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (!(key in KEY_MAP)) return;
        e.preventDefault();

        if (!keyboardPressed.has(key)) return;
        keyboardPressed.delete(key);

        const midi = KEY_MAP[key];
        const el = keyElementsByMidi.get(midi);
        if (!el) return;

        // 只有当该音符没有被其他来源按着时才释放（简化处理）
        if (pressedMidiSet.has(midi)) {
          // 检查是否还有指针按着？我们无法区分，直接释放
          pressedMidiSet.delete(midi);
          el.classList.remove('active');

          if (!pedalDown) {
            for (let i = activeVoices.length - 1; i >= 0; i--) {
              const voice = activeVoices[i];
              if (voice.midi === midi && !voice.released) {
                releaseVoice(voice, 0.1);
              }
            }
          }
        }
      });

      // ============================================================
      // 6. 延音踏板
      // ============================================================
      const pedalButton = document.getElementById('sustainPedal');
      const pedalLed = document.getElementById('pedalLed');

      function setPedal(down) {
        if (pedalDown === down) return;
        pedalDown = down;

        if (down) {
          pedalLed.classList.add('on');
          pedalButton.classList.add('active');

          // 延长当前所有活动音符的衰减
          if (audioCtx) {
            const now = audioCtx.currentTime;
            activeVoices.forEach(voice => {
              if (!voice.released) {
                try {
                  const gain = voice.noteGain.gain;
                  gain.cancelScheduledValues(now);
                  gain.setValueAtTime(gain.value, now);
                  gain.exponentialRampToValueAtTime(0.001, now + 4.5);
                } catch (e) {}
              }
            });
          }
        } else {
          pedalLed.classList.remove('on');
          pedalButton.classList.remove('active');

          // 释放所有未被按住的音符
          releaseUntouchedVoices();
        }
      }

      pedalButton.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        initAudio();
        resumeAudio();
        setPedal(true);
        try {
          pedalButton.setPointerCapture(e.pointerId);
        } catch (err) {}
      });

      pedalButton.addEventListener('pointerup', (e) => {
        e.preventDefault();
        setPedal(false);
        try {
          pedalButton.releasePointerCapture(e.pointerId);
        } catch (err) {}
      });

      pedalButton.addEventListener('pointercancel', () => {
        setPedal(false);
      });

      // 防止在踏板上触摸时页面滚动
      pedalButton.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

      // ============================================================
      // 7. 窗口失焦时释放所有音符（防止卡音）
      // ============================================================
      window.addEventListener('blur', () => {
        // 清除所有高亮
        keyElementsByMidi.forEach(el => el.classList.remove('active'));
        pressedMidiSet.clear();
        keyboardPressed.clear();

        // 释放所有活动声音
        if (audioCtx) {
          activeVoices.slice().forEach(voice => {
            if (!voice.released) {
              releaseVoice(voice, 0.1);
            }
          });
        }

        // 踏板状态复位
        setPedal(false);
      });

      // ============================================================
      // 8. 自动滚动到中音区 C4
      // ============================================================
      setTimeout(() => {
        const scrollContainer = document.querySelector('.keyboard-scroll');
        if (!scrollContainer) return;
        const c4Element = keyElementsByMidi.get(60);
        if (c4Element) {
          const containerWidth = scrollContainer.clientWidth;
          const elLeft = c4Element.offsetLeft;
          scrollContainer.scrollLeft = Math.max(0, elLeft - containerWidth / 2 + 80);
        }
      }, 150);

      // ============================================================
      // 9. 防止页面滚动（当键盘操作时）
      // ============================================================
      window.addEventListener('keydown', (e) => {
        if (e.key in KEY_MAP || e.key === ' ') {
          e.preventDefault();
        }
      }, { passive: false });

    })();
  </script>
</body>
</html>
