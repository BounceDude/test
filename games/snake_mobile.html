<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>贪吃蛇 · 霓虹迷宫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #07070f;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            color: white;
            touch-action: none;
        }

        canvas {
            display: block;
            background: #07070f;
            touch-action: none;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(0, 255, 180, 0.1);
        }

        /* HUD */
        .hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid rgba(0, 255, 180, 0.3);
            backdrop-filter: blur(6px);
        }

        .hud-label {
            font-size: 10px;
            color: #66ffcc;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ffaa;
            text-shadow: 0 0 15px rgba(0, 255, 170, 0.6);
            line-height: 1.1;
        }

        .hud-value.best {
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            font-size: 18px;
        }

        /* 方向提示 */
        .direction-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #445566;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
            transition: opacity 0.5s;
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 18, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s;
            padding: 24px;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            font-size: 30px;
            color: #00ffaa;
            text-shadow: 0 0 30px rgba(0, 255, 170, 0.5);
            margin-bottom: 6px;
            letter-spacing: 3px;
            text-align: center;
        }

        .overlay .subtitle {
            font-size: 14px;
            color: #8899bb;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.7;
            max-width: 280px;
        }

        .overlay .final-score {
            font-size: 52px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.5);
            margin-bottom: 4px;
        }

        .overlay .final-label {
            font-size: 13px;
            color: #8899bb;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .overlay .new-record {
            font-size: 16px;
            color: #ff66aa;
            text-shadow: 0 0 20px rgba(255, 100, 170, 0.6);
            margin-bottom: 20px;
            animation: recordPulse 1s ease-in-out infinite alternate;
        }

        @keyframes recordPulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .btn {
            background: linear-gradient(135deg, #00cc88, #00ffaa);
            color: #07070f;
            border: none;
            padding: 16px 52px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 30px rgba(0, 255, 170, 0.3);
            transition: transform 0.15s, box-shadow 0.15s;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.2);
        }

        /* 分数弹出 */
        .score-pop {
            position: fixed;
            font-size: 18px;
            font-weight: bold;
            color: #00ffaa;
            pointer-events: none;
            z-index: 50;
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        /* 加速提示 */
        .speed-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(0, 255, 170, 0.08));
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .speed-flash.active {
            opacity: 1;
        }

        /* 方向按钮（备用触摸控制） */
        .touch-controls {
            position: fixed;
            bottom: 30px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 20;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .touch-controls:hover {
            opacity: 1;
        }

        .dpad-row {
            display: flex;
            gap: 6px;
        }

        .dpad-btn {
            width: 48px;
            height: 48px;
            background: rgba(0, 255, 170, 0.12);
            border: 1.5px solid rgba(0, 255, 170, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffaa;
            font-size: 20px;
            font-weight: bold;
            touch-action: manipulation;
            cursor: pointer;
            transition: background 0.1s;
        }

        .dpad-btn:active {
            background: rgba(0, 255, 170, 0.3);
        }

        .dpad-btn.empty {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 400px) {
            .touch-controls {
                transform: scale(0.85);
                transform-origin: bottom right;
            }
        }

        /* 隐藏触摸控制（当滑动时） */
        .touch-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-box">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="scoreDisplay">0</div>
        </div>
        <div class="hud-box" style="text-align: right;">
            <div class="hud-label">Best</div>
            <div class="hud-value best" id="bestDisplay">0</div>
        </div>
        <div class="hud-box" style="text-align: center;">
            <div class="hud-label">Length</div>
            <div class="hud-value" id="lengthDisplay" style="font-size: 18px;">3</div>
        </div>
    </div>

    <!-- 画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 加速闪屏 -->
    <div class="speed-flash" id="speedFlash"></div>

    <!-- 方向提示 -->
    <div class="direction-hint" id="hintEl">滑动屏幕控制方向</div>

    <!-- 触摸方向按钮（备用） -->
    <div class="touch-controls" id="touchControls">
        <div class="dpad-row">
            <div class="dpad-btn empty"></div>
            <div class="dpad-btn" data-dir="up">▲</div>
            <div class="dpad-btn empty"></div>
        </div>
        <div class="dpad-row">
            <div class="dpad-btn" data-dir="left">◀</div>
            <div class="dpad-btn empty"></div>
            <div class="dpad-btn" data-dir="right">▶</div>
        </div>
        <div class="dpad-row">
            <div class="dpad-btn empty"></div>
            <div class="dpad-btn" data-dir="down">▼</div>
            <div class="dpad-btn empty"></div>
        </div>
    </div>

    <!-- 开始遮罩 -->
    <div class="overlay" id="startOverlay">
        <h1>贪吃蛇</h1>
        <div class="subtitle">滑动屏幕控制方向<br>吃到果实得分并变长<br>不要撞墙或撞到自己</div>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>

    <!-- 结束遮罩 -->
    <div class="overlay hidden" id="overOverlay">
        <h1 style="color: #ff4466;">游戏结束</h1>
        <div class="final-score" id="finalScore">0</div>
        <div class="final-label">得分</div>
        <div class="new-record hidden" id="newRecord">🎉 新纪录！</div>
        <button class="btn" id="restartBtn">再来一局</button>
    </div>

<script>
    (function() {
        'use strict';

        // ==================== 配置 ====================
        const CONFIG = {
            gridSize: 20,           // 网格单元格大小
            cols: 20,               // 列数
            rows: 20,               // 行数
            initialSpeed: 160,      // 初始移动间隔（毫秒）
            minSpeed: 70,           // 最快速度
            speedDecrease: 4,       // 每吃一个果实减少的毫秒数
            initialLength: 3,       // 初始长度
            colors: {
                snakeHead: '#00ffaa',
                snakeBody: '#00cc88',
                snakeBodyAlt: '#00aa77',
                food: '#ff4466',
                foodGlow: 'rgba(255, 68, 102, 0.6)',
                grid: 'rgba(0, 255, 170, 0.04)',
                gridBorder: 'rgba(0, 255, 170, 0.08)'
            }
        };

        // ==================== 画布 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');
        const lengthDisplay = document.getElementById('lengthDisplay');
        const startOverlay = document.getElementById('startOverlay');
        const overOverlay = document.getElementById('overOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const newRecordEl = document.getElementById('newRecord');
        const hintEl = document.getElementById('hintEl');
        const speedFlash = document.getElementById('speedFlash');
        const touchControls = document.getElementById('touchControls');

        let W, H;
        let cellSize;
        let gridOffsetX, gridOffsetY;

        // 最佳分数（持久化）
        let bestScore = parseInt(localStorage.getItem('snake_best_score') || '0', 10);
        bestDisplay.textContent = bestScore;

        // ==================== 游戏状态 ====================
        const game = {
            running: false,
            score: 0,
            snake: [],           // [{x, y}, ...] 从头部到尾
            direction: { x: 1, y: 0 },  // 当前移动方向
            nextDirection: { x: 1, y: 0 }, // 下一帧方向
            food: { x: 0, y: 0 },
            speed: CONFIG.initialSpeed,
            lastMoveTime: 0,
            moveInterval: CONFIG.initialSpeed,
            particles: [],
            stars: [],
            frame: 0,
            growing: 0,          // 待增长节数
            deathFlash: 0,
            foodPulse: 0,
            lastTime: 0
        };

        // 初始化星星背景
        function initStars() {
            game.stars = [];
            for (let i = 0; i < 50; i++) {
                game.stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 0.2 + 0.05,
                    opacity: Math.random() * 0.5 + 0.15
                });
            }
        }

        // ==================== 尺寸适配 ====================
        function resize() {
            const padding = 16;
            const maxW = Math.min(window.innerWidth, 460);
            const maxH = window.innerHeight;

            // 计算合适的格子大小
            const availableW = maxW - padding * 2;
            const availableH = maxH - 140; // 留出 HUD 和底部空间

            cellSize = Math.floor(Math.min(
                availableW / CONFIG.cols,
                availableH / CONFIG.rows
            ));

            // 限制最小格子大小
            cellSize = Math.max(cellSize, 14);
            cellSize = Math.min(cellSize, 28);

            W = cellSize * CONFIG.cols + padding * 2;
            H = cellSize * CONFIG.rows + padding * 2 + 100;

            canvas.width = W;
            canvas.height = H;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';

            gridOffsetX = padding;
            gridOffsetY = padding + 60; // 顶部偏移给 HUD

            if (game.running) {
                // 重新计算蛇和食物的位置（防止错位）
                // 实际上不需要，因为坐标是基于网格的
            }

            initStars();
        }
        window.addEventListener('resize', resize);

        // ==================== 坐标转换 ====================
        function gridToPixel(gx, gy) {
            return {
                x: gridOffsetX + gx * cellSize + cellSize / 2,
                y: gridOffsetY + gy * cellSize + cellSize / 2
            };
        }

        // ==================== 游戏初始化 ====================
        function initGame() {
            game.score = 0;
            game.speed = CONFIG.initialSpeed;
            game.moveInterval = CONFIG.initialSpeed;
            game.lastMoveTime = 0;
            game.growing = 0;
            game.deathFlash = 0;
            game.particles = [];
            game.frame = 0;
            game.foodPulse = 0;

            // 蛇初始位置：中间偏左，向右移动
            const startX = Math.floor(CONFIG.cols / 2) - 1;
            const startY = Math.floor(CONFIG.rows / 2);
            game.snake = [];
            for (let i = 0; i < CONFIG.initialLength; i++) {
                game.snake.push({ x: startX - i, y: startY });
            }

            game.direction = { x: 1, y: 0 };
            game.nextDirection = { x: 1, y: 0 };

            // 生成第一个食物
            spawnFood();

            updateScoreUI();
            updateLengthUI();
            updateSpeedUI();
        }

        // ==================== 食物生成 ====================
        function spawnFood() {
            const maxAttempts = 500;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const fx = Math.floor(Math.random() * CONFIG.cols);
                const fy = Math.floor(Math.random() * CONFIG.rows);

                // 检查是否与蛇重叠
                let overlap = false;
                for (const seg of game.snake) {
                    if (seg.x === fx && seg.y === fy) {
                        overlap = true;
                        break;
                    }
                }

                if (!overlap) {
                    game.food = { x: fx, y: fy };
                    game.foodPulse = 1;
                    return;
                }
            }

            // 如果找不到空位（蛇占满网格），游戏胜利
            endGame('恭喜！你填满了整个屏幕！');
        }

        // ==================== 方向控制 ====================
        function setDirection(dx, dy) {
            if (!game.running) return;

            // 不能直接反向
            if (game.direction.x === -dx && game.direction.y === -dy) return;

            // 不能与当前 nextDirection 反向
            if (game.nextDirection.x === -dx && game.nextDirection.y === -dy) return;

            game.nextDirection = { x: dx, y: dy };

            // 隐藏触摸控制（提示用户使用滑动）
            touchControls.classList.add('hidden');
            setTimeout(() => touchControls.classList.remove('hidden'), 1500);
        }

        // ==================== 触摸/滑动控制 ====================
        let touchStartX = 0, touchStartY = 0;
        let touchStartTime = 0;
        let isSwiping = false;
        const SWIPE_THRESHOLD = 20; // 最小滑动距离（像素）
        const SWIPE_TIMEOUT = 500;  // 滑动时间限制（毫秒）

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!game.running) return;

            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchStartTime = Date.now();
            isSwiping = true;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!game.running || !isSwiping) return;

            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;

            // 已经超过阈值，判断方向
            if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
                isSwiping = false;

                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (dx > 0) setDirection(1, 0);
                    else setDirection(-1, 0);
                } else {
                    // 垂直滑动
                    if (dy > 0) setDirection(0, 1);
                    else setDirection(0, -1);
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isSwiping = false;
        }, { passive: false });

        // 鼠标支持（桌面调试）
        let mouseDown = false;
        let mouseStartX = 0, mouseStartY = 0;

        canvas.addEventListener('mousedown', (e) => {
            if (!game.running) return;
            e.preventDefault();
            mouseDown = true;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!game.running || !mouseDown) return;
            const dx = e.clientX - mouseStartX;
            const dy = e.clientY - mouseStartY;

            if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD) {
                mouseDown = false;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) setDirection(1, 0);
                    else setDirection(-1, 0);
                } else {
                    if (dy > 0) setDirection(0, 1);
                    else setDirection(0, -1);
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        // 键盘支持
        window.addEventListener('keydown', (e) => {
            if (!game.running) return;
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    setDirection(1, 0);
                    break;
            }
        });

        // 触摸方向按钮
        document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!game.running) return;
                const dir = btn.dataset.dir;
                switch (dir) {
                    case 'up': setDirection(0, -1); break;
                    case 'down': setDirection(0, 1); break;
                    case 'left': setDirection(-1, 0); break;
                    case 'right': setDirection(1, 0); break;
                }
            }, { passive: false });

            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!game.running) return;
                const dir = btn.dataset.dir;
                switch (dir) {
                    case 'up': setDirection(0, -1); break;
                    case 'down': setDirection(0, 1); break;
                    case 'left': setDirection(-1, 0); break;
                    case 'right': setDirection(1, 0); break;
                }
            });
        });

        // ==================== 游戏逻辑更新 ====================
        function updateGame(dt) {
            if (!game.running) return;

            game.frame++;
            game.foodPulse += dt / 1000 * 4;

            // 更新粒子
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx * (dt / 16.67);
                p.y += p.vy * (dt / 16.67);
                p.vy += 0.08 * (dt / 16.67);
                p.life -= dt / 1000;
                if (p.life <= 0) {
                    game.particles.splice(i, 1);
                }
            }

            // 更新星星
            game.stars.forEach(s => {
                s.y += s.speed * (dt / 16.67);
                if (s.y > H) {
                    s.y = -5;
                    s.x = Math.random() * W;
                }
            });

            // 死亡闪屏效果
            if (game.deathFlash > 0) {
                game.deathFlash -= dt / 1000;
            }

            // 移动逻辑
            game.lastMoveTime += dt;
            if (game.lastMoveTime >= game.moveInterval) {
                game.lastMoveTime -= game.moveInterval;
                moveSnake();
            }
        }

        function moveSnake() {
            // 应用方向
            game.direction = { ...game.nextDirection };

            const head = game.snake[0];
            const newHead = {
                x: head.x + game.direction.x,
                y: head.y + game.direction.y
            };

            // 检查墙壁碰撞
            if (newHead.x < 0 || newHead.x >= CONFIG.cols ||
                newHead.y < 0 || newHead.y >= CONFIG.rows) {
                endGame('撞墙了！');
                return;
            }

            // 检查自碰撞（不包括尾部即将移走的格子）
            const willGrow = game.growing > 0 || (newHead.x === game.food.x && newHead.y === game.food.y);

            for (let i = 0; i < game.snake.length; i++) {
                const seg = game.snake[i];
                // 如果不会增长，尾部的格子会被移走，不算碰撞
                if (!willGrow && i === game.snake.length - 1) continue;
                if (seg.x === newHead.x && seg.y === newHead.y) {
                    endGame('撞到自己了！');
                    return;
                }
            }

            // 移动蛇
            game.snake.unshift(newHead);

            // 检查是否吃到食物
            if (newHead.x === game.food.x && newHead.y === game.food.y) {
                // 吃到食物
                game.growing += 1;
                game.score += 10;
                updateScoreUI();

                // 加速
                game.moveInterval = Math.max(
                    CONFIG.minSpeed,
                    game.moveInterval - CONFIG.speedDecrease
                );
                updateSpeedUI();

                // 食物粒子爆炸
                const foodPos = gridToPixel(game.food.x, game.food.y);
                for (let i = 0; i < 15; i++) {
                    const angle = (Math.PI * 2 / 15) * i + Math.random() * 0.5;
                    const speed = Math.random() * 4 + 2;
                    game.particles.push({
                        x: foodPos.x,
                        y: foodPos.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.5 + Math.random() * 0.3,
                        maxLife: 0.8,
                        size: Math.random() * 4 + 2,
                        color: CONFIG.colors.food
                    });
                }

                // 分数弹出
                showScorePop(foodPos.x, foodPos.y, '+10');

                // 加速闪光
                speedFlash.classList.add('active');
                setTimeout(() => speedFlash.classList.remove('active'), 200);

                // 生成新食物
                spawnFood();

                // 更新长度显示
                updateLengthUI();
            } else {
                // 没有吃到食物，如果不在增长状态，移除尾部
                if (game.growing > 0) {
                    game.growing--;
                } else {
                    game.snake.pop();
                }
            }
        }

        // ==================== 结束游戏 ====================
        function endGame(reason) {
            if (!game.running) return;
            game.running = false;

            // 死亡闪屏
            game.deathFlash = 0.6;

            // 更新最佳分数
            let isNewRecord = false;
            if (game.score > bestScore) {
                bestScore = game.score;
                localStorage.setItem('snake_best_score', bestScore);
                bestDisplay.textContent = bestScore;
                isNewRecord = true;
            }

            // 显示结束遮罩
            finalScoreEl.textContent = game.score;
            if (isNewRecord) {
                newRecordEl.classList.remove('hidden');
            } else {
                newRecordEl.classList.add('hidden');
            }

            // 更新结束原因
            const subtitle = overOverlay.querySelector('.subtitle');
            if (subtitle) {
                subtitle.textContent = reason || '游戏结束';
            } else {
                // 如果没有 subtitle 元素，创建一个
                const existingSub = overOverlay.querySelector('p');
                if (existingSub) {
                    existingSub.textContent = reason || '游戏结束';
                }
            }

            // 延迟显示遮罩，让玩家看到死亡效果
            setTimeout(() => {
                overOverlay.classList.remove('hidden');
            }, 400);

            hintEl.style.opacity = '0';
        }

        // ==================== UI 更新 ====================
        function updateScoreUI() {
            scoreDisplay.textContent = game.score;
        }

        function updateLengthUI() {
            lengthDisplay.textContent = game.snake.length;
        }

        function updateSpeedUI() {
            // 速度显示（可选）
            const speedPercent = Math.round(
                (1 - (game.moveInterval - CONFIG.minSpeed) / (CONFIG.initialSpeed - CONFIG.minSpeed)) * 100
            );
            // 暂时不显示速度百分比，保留接口
        }

        function showScorePop(x, y, text) {
            const el = document.createElement('div');
            el.className = 'score-pop';
            el.textContent = text;
            el.style.left = (x / W * 100) + '%';
            el.style.top = (y / H * 100) + '%';
            el.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // ==================== 绘制 ====================
        function draw() {
            // 背景
            ctx.fillStyle = '#07070f';
            ctx.fillRect(0, 0, W, H);

            // 星星
            game.stars.forEach(s => {
                ctx.globalAlpha = s.opacity;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 死亡闪红
            if (game.deathFlash > 0) {
                ctx.fillStyle = `rgba(255, 40, 60, ${game.deathFlash * 0.4})`;
                ctx.fillRect(0, 0, W, H);
            }

            // 绘制网格
            drawGrid();

            // 绘制食物
            drawFood();

            // 绘制蛇
            drawSnake();

            // 绘制粒子
            drawParticles();

            // 绘制得分区域（顶部）
            drawTopBar();
        }

        function drawGrid() {
            const gridW = CONFIG.cols * cellSize;
            const gridH = CONFIG.rows * cellSize;

            // 网格线
            ctx.strokeStyle = CONFIG.colors.grid;
            ctx.lineWidth = 1;

            for (let i = 0; i <= CONFIG.cols; i++) {
                const x = gridOffsetX + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(x, gridOffsetY);
                ctx.lineTo(x, gridOffsetY + gridH);
                ctx.stroke();
            }

            for (let i = 0; i <= CONFIG.rows; i++) {
                const y = gridOffsetY + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(gridOffsetX, y);
                ctx.lineTo(gridOffsetX + gridW, y);
                ctx.stroke();
            }

            // 边框
            ctx.strokeStyle = CONFIG.colors.gridBorder;
            ctx.lineWidth = 2;
            ctx.strokeRect(gridOffsetX - 1, gridOffsetY - 1, gridW + 2, gridH + 2);

            // 边框光效
            ctx.shadowColor = 'rgba(0, 255, 170, 0.15)';
            ctx.shadowBlur = 20;
            ctx.strokeRect(gridOffsetX - 1, gridOffsetY - 1, gridW + 2, gridH + 2);
            ctx.shadowBlur = 0;
        }

        function drawSnake() {
            for (let i = 0; i < game.snake.length; i++) {
                const seg = game.snake[i];
                const pos = gridToPixel(seg.x, seg.y);

                // 蛇身颜色渐变
                let color;
                if (i === 0) {
                    color = CONFIG.colors.snakeHead;
                } else {
                    const t = i / game.snake.length;
                    color = i % 2 === 0 ? CONFIG.colors.snakeBody : CONFIG.colors.snakeBodyAlt;
                    // 越靠近尾部越暗
                    const brightness = 1 - t * 0.4;
                    color = adjustColor(color, brightness);
                }

                // 阴影
                ctx.shadowColor = i === 0 ? '#00ffaa' : 'rgba(0, 200, 136, 0.3)';
                ctx.shadowBlur = i === 0 ? 18 : 8;

                // 圆角矩形
                const padding = i === 0 ? 1.5 : 2;
                const x = pos.x - cellSize / 2 + padding;
                const y = pos.y - cellSize / 2 + padding;
                const size = cellSize - padding * 2;
                const radius = i === 0 ? 6 : 4;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, radius);
                ctx.fill();

                // 头部高光
                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.beginPath();
                    ctx.arc(pos.x - 2, pos.y - 2, size * 0.2, 0, Math.PI * 2);
                    ctx.fill();

                    // 眼睛
                    const eyeOffset = size * 0.22;
                    const eyeSize = size * 0.12;
                    const dir = game.direction;

                    // 根据方向调整眼睛位置
                    let eyeX1, eyeY1, eyeX2, eyeY2;
                    if (dir.x === 1) { // 右
                        eyeX1 = pos.x + eyeOffset; eyeY1 = pos.y - eyeOffset;
                        eyeX2 = pos.x + eyeOffset; eyeY2 = pos.y + eyeOffset;
                    } else if (dir.x === -1) { // 左
                        eyeX1 = pos.x - eyeOffset; eyeY1 = pos.y - eyeOffset;
                        eyeX2 = pos.x - eyeOffset; eyeY2 = pos.y + eyeOffset;
                    } else if (dir.y === -1) { // 上
                        eyeX1 = pos.x - eyeOffset; eyeY1 = pos.y - eyeOffset;
                        eyeX2 = pos.x + eyeOffset; eyeY2 = pos.y - eyeOffset;
                    } else { // 下
                        eyeX1 = pos.x - eyeOffset; eyeY1 = pos.y + eyeOffset;
                        eyeX2 = pos.x + eyeOffset; eyeY2 = pos.y + eyeOffset;
                    }

                    ctx.fillStyle = '#07070f';
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.shadowBlur = 0;
            }
        }

        function drawFood() {
            const pos = gridToPixel(game.food.x, game.food.y);
            const pulse = 1 + Math.sin(game.foodPulse) * 0.15;
            const radius = (cellSize / 2 - 3) * pulse;

            // 光晕
            ctx.shadowColor = CONFIG.colors.foodGlow;
            ctx.shadowBlur = 20 + Math.sin(game.foodPulse) * 10;

            // 果实主体
            ctx.fillStyle = CONFIG.colors.food;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            ctx.fill();

            // 高光
            ctx.shadowBlur = 0;
            const gradient = ctx.createRadialGradient(
                pos.x - radius * 0.3, pos.y - radius * 0.3, radius * 0.1,
                pos.x, pos.y, radius
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            ctx.fill();

            // 小高光点
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(pos.x - radius * 0.25, pos.y - radius * 0.25, radius * 0.18, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawParticles() {
            game.particles.forEach(p => {
                const alpha = Math.max(0, p.life / p.maxLife);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawTopBar() {
            // 顶部得分显示（画布内）
            const barY = gridOffsetY - 38;
            const centerX = W / 2;

            // 得分文字
            ctx.fillStyle = 'rgba(0, 255, 170, 0.08)';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(game.score, centerX, barY);

            // 速度指示条
            const speedRatio = (CONFIG.initialSpeed - game.moveInterval) / (CONFIG.initialSpeed - CONFIG.minSpeed);
            const barWidth = 100;
            const barHeight = 4;
            const barX = centerX - barWidth / 2;
            const barY2 = barY + 22;

            ctx.fillStyle = 'rgba(0, 255, 170, 0.1)';
            ctx.beginPath();
            ctx.roundRect(barX, barY2, barWidth, barHeight, 2);
            ctx.fill();

            if (speedRatio > 0) {
                ctx.fillStyle = speedRatio > 0.7 ? '#ff4466' : '#00ffaa';
                ctx.shadowColor = speedRatio > 0.7 ? '#ff4466' : '#00ffaa';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.roundRect(barX, barY2, barWidth * speedRatio, barHeight, 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ==================== 颜色工具 ====================
        function adjustColor(hex, factor) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${Math.round(r * factor)}, ${Math.round(g * factor)}, ${Math.round(b * factor)})`;
        }

        // ==================== 主循环 ====================
        function gameLoop(timestamp) {
            if (!game.lastTime) game.lastTime = timestamp;
            const dt = Math.min(timestamp - game.lastTime, 50);
            game.lastTime = timestamp;

            if (game.running) {
                updateGame(dt);
            } else if (game.deathFlash > 0) {
                // 死亡后仍然更新粒子
                for (let i = game.particles.length - 1; i >= 0; i--) {
                    const p = game.particles[i];
                    p.x += p.vx * (dt / 16.67);
                    p.y += p.vy * (dt / 16.67);
                    p.vy += 0.08 * (dt / 16.67);
                    p.life -= dt / 1000;
                    if (p.life <= 0) game.particles.splice(i, 1);
                }
                game.deathFlash -= dt / 1000;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // ==================== 开始游戏 ====================
        function startGame() {
            resize(); // 确保尺寸正确
            initGame();
            initStars();

            game.running = true;
            game.lastTime = 0;

            // 隐藏遮罩
            startOverlay.classList.add('hidden');
            overOverlay.classList.add('hidden');
            newRecordEl.classList.add('hidden');

            // 显示提示
            hintEl.style.opacity = '1';
            hintEl.textContent = '滑动屏幕控制方向';
            setTimeout(() => {
                hintEl.style.opacity = '0';
            }, 3000);

            // 显示触摸控制（移动端）
            touchControls.classList.remove('hidden');

            // 更新 UI
            updateScoreUI();
            updateLengthUI();
            bestDisplay.textContent = bestScore;

            // 重置 lastTime
            game.lastTime = 0;
        }

        // ==================== 事件绑定 ====================
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) e.preventDefault();
        }, { passive: false });

        // 初始化
        resize();
        initGame();
        draw();

        // 启动主循环
        requestAnimationFrame(gameLoop);

        // roundRect polyfill
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
    })();
</script>
</body>
